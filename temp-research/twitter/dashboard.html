<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Twitter Intelligence</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0b; color: #e1e1e6; }
.top { display: flex; align-items: baseline; gap: 1.5rem; padding: 1rem 1.5rem; border-bottom: 1px solid #1e1e22; }
.top h1 { font-size: 1.1rem; font-weight: 600; }
.top .summary { color: #666; font-size: 0.8rem; }
.table-wrap { width: 100%; overflow-x: auto; }
table { width: 100%; table-layout: fixed; border-collapse: collapse; font-size: 0.78rem; }
th { text-align: left; padding: 0.5rem 0.5rem; border-bottom: 1px solid #2a2a2e; color: #555; font-weight: 500; text-transform: uppercase; letter-spacing: 0.03em; font-size: 0.65rem; white-space: nowrap; }
td { padding: 0.45rem 0.5rem; border-bottom: 1px solid #1a1a1e; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; position: relative; }
tr:hover td { background: #0f0f12; }
.handle { font-weight: 500; color: #fff; }
.tag { display: inline; padding: 0.06rem 0.3rem; border-radius: 2px; font-size: 0.65rem; margin: 0 0.08rem; }
.tcrypto { background: #1a3a2a; color: #4ade80; }
.tequities { background: #1a2a3a; color: #60a5fa; }
.tmacro { background: #3a2a1a; color: #fbbf24; }
.toptions { background: #3a1a2a; color: #f472b6; }
.trates_fx { background: #1a2a3a; color: #60a5fa; }
.tother { background: #2a2a2e; color: #888; }
.plus { color: #555; font-size: 0.65rem; }
.grn { color: #4ade80; }
.yel { color: #fbbf24; }
.gry { color: #555; }
.qual { font-variant-numeric: tabular-nums; }
td[data-tip] span { border-bottom: 1px dotted #444; cursor: help; }
td[data-tip]:hover { overflow: visible; }
td[data-tip]:hover::after {
  content: attr(data-tip);
  position: absolute;
  left: 0;
  bottom: 100%;
  background: #1a1a1e;
  color: #ccc;
  font-size: 0.75rem;
  padding: 0.4rem 0.7rem;
  border-radius: 4px;
  white-space: normal;
  max-width: 350px;
  line-height: 1.4;
  z-index: 100;
  pointer-events: none;
  box-shadow: 0 4px 16px rgba(0,0,0,.6);
  border: 1px solid #2a2a2e;
}
.sort-asc::after { content: ' ▲'; font-size: 0.55rem; }
.sort-desc::after { content: ' ▼'; font-size: 0.55rem; }
th { cursor: pointer; user-select: none; }
</style>
</head>
<body>
<div class="top">
<h1>Twitter Intelligence</h1>
<div class="summary">__SCRAPED__/__TOTAL__ scraped &middot; __TWEETS__ tweets &middot; __TAX_DONE__ taxonomy done &middot; latest: __LATEST__</div>
</div>
<div class="table-wrap">
<table>
<thead>
<tr><th style="width:8%">Handle</th><th style="width:4%">Δ</th><th style="width:8%">Scraped</th><th style="width:4%">Tax</th><th style="width:7%">Roles</th><th style="width:8%">Mkts</th><th style="width:8%">Topics</th><th style="width:7%">Sig</th><th style="width:5%">Hor</th><th style="width:7%">Use</th><th style="width:7%">Assets</th><th style="width:5%">Flags</th><th style="width:7%">Qual</th><th style="width:15%">Notes</th></tr>
</thead>
<tbody>
__ROWS__
</tbody>
</table>
</div>
<script>
const table = document.querySelector('table');
const thead = table.querySelector('thead');
const tbody = table.querySelector('tbody');

function parseVal(v) {
  v = v.replace(/[^0-9\-]/g, '');
  return v ? parseInt(v, 10) : NaN;
}

function sortRows(colIdx) {
  const rows = Array.from(tbody.querySelectorAll('tr'));
  const dir = thead.querySelectorAll('th')[colIdx].classList.contains('sort-asc') ? -1 : 1;

  thead.querySelectorAll('th').forEach(th => th.classList.remove('sort-asc', 'sort-desc'));
  thead.querySelectorAll('th')[colIdx].classList.add(dir === 1 ? 'sort-asc' : 'sort-desc');

  const isNumeric = [1, 3].includes(colIdx);

  rows.sort((a, b) => {
    const va = a.children[colIdx]?.textContent.trim() || '';
    const vb = b.children[colIdx]?.textContent.trim() || '';
    if (isNumeric) {
      const na = parseVal(va), nb = parseVal(vb);
      if (isNaN(na) && isNaN(nb)) return 0;
      if (isNaN(na)) return 1;
      if (isNaN(nb)) return -1;
      return dir * (na - nb);
    }
    return dir * va.localeCompare(vb);
  });

  rows.forEach(r => tbody.appendChild(r));
}

thead.querySelectorAll('th').forEach((th, i) => {
  th.addEventListener('click', () => sortRows(i));
});
</script>
</body>
</html>
