<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Kernel Study App</title>
  <link rel="stylesheet" href="theme.css?v=3">
</head>
<body>
  <div id="app-shell">
    <header id="app-header">
      <div id="brand"><h1><span>Kernel</span> Study</h1><p>captured kernel behavior</p></div>
      <nav id="view-tabs" aria-label="Visualizations">
        <button class="view-tab active" data-view="core" data-src="views/core.html">Core</button>
        <button class="view-tab" data-view="mm" data-src="views/mm.html">MM</button>
        <button class="view-tab" data-view="cfs" data-src="views/cfs-tree.html">CFS Tree</button>
      </nav>
      <div id="view-description">Process creation, scheduling, and exit</div>
    </header>
    <iframe id="viewer-frame" title="Kernel capture visualization" src="views/core.html"></iframe>
  </div>
  <script>
  (function(){
    'use strict';
    var descriptions={core:'Process creation, scheduling, and exit',mm:'Page, slab, cache, and writeback activity',cfs:'CFS red-black tree after enqueue operations'};
    var tabs=Array.prototype.slice.call(document.querySelectorAll('.view-tab'));
    var frame=document.getElementById('viewer-frame'),description=document.getElementById('view-description');
    tabs.forEach(function(tab){tab.addEventListener('click',function(){tabs.forEach(function(item){item.classList.remove('active')});tab.classList.add('active');frame.src=tab.dataset.src;description.textContent=descriptions[tab.dataset.view]})});
  })();
  </script>
</body>
</html>
