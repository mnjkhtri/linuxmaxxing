<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070b10"><title>Linuxmaxxing</title><link rel="stylesheet" href="theme.css?v=7"></head>
<body><div id="app-shell">
<header id="app-header">
<div id="brand"><span id="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><div><h1><span>LINUX</span>::MAXXING</h1><p>kernel internals in motion</p></div></div>
<nav id="view-tabs" role="tablist" aria-label="Kernel subsystems">
<button id="tab-sched" class="view-tab" role="tab" aria-selected="false" tabindex="-1" data-view="sched" data-src="views/scheduler/scheduler.html?v=38">SCHED</button>
<button id="tab-kapi" class="view-tab" role="tab" aria-selected="false" tabindex="-1" data-view="kapi" data-src="views/kapi/kapi.html?v=106&amp;section=layout">KAPI</button>
<button id="tab-mm" class="view-tab" role="tab" aria-selected="false" tabindex="-1" data-view="mm" data-src="views/memory/memory.html?v=1">MM</button>
<button id="tab-io" class="view-tab" role="tab" aria-selected="false" tabindex="-1" data-view="io" data-src="views/io/io.html?v=1">IO</button>
<button id="tab-virt" class="view-tab" role="tab" aria-selected="false" tabindex="-1" data-view="virt" data-src="views/virt-ept/virt-ept.html?v=40">VIRT</button>
<button id="tab-virtio" class="view-tab" role="tab" aria-selected="false" tabindex="-1" data-view="virtio" data-src="views/virt-io/virt-io.html?v=4" style="color:#e8cf68">VIRT·IO</button>
</nav><div id="view-context"><span class="trace-dot" aria-hidden="true"></span><span id="view-state">SYSTEM READY</span><span id="view-description"></span></div>
</header><main id="viewer-wrap"><iframe id="viewer-frame" title="Kernel subsystem visualization"></iframe><div id="frame-loader" role="status"><span><i class="trace-dot"></i>building subsystem view…</span></div></main>
</div><script>
(function(){'use strict';var views={sched:{description:'CFS runqueues · task lifetimes · CPU migration'},kapi:{description:'tasks · canonical memory map · allocator mechanisms'},mm:{description:'mm_struct · VMA topology · page tables'},io:{description:'MMIO · DMA · IRQ (qedu PCI device via QEMU EDU)'},virt:{description:'KVM_RUN · EPT state · MMU invalidation (toy-VMM)'},virtio:{description:'device MMIO · virtual DMA · IOAPIC/LAPIC · guest ISR (toy MMIO device)'}};var aliases={core:'sched',layout:'kapi',irq:'io',ept:'virt'},tabs=Array.prototype.slice.call(document.querySelectorAll('.view-tab')),frame=document.getElementById('viewer-frame'),description=document.getElementById('view-description'),loader=document.getElementById('frame-loader');
function activate(name,focus){name=aliases[name]||name;var tab=tabs.filter(function(t){return t.dataset.view===name})[0]||tabs[0];tabs.forEach(function(item){var on=item===tab;item.classList.toggle('active',on);item.setAttribute('aria-selected',String(on));item.tabIndex=on?0:-1});description.textContent=views[tab.dataset.view].description;if(frame.getAttribute('src')!==tab.dataset.src){loader.classList.remove('hidden');frame.src=tab.dataset.src};if(location.hash!=='#'+tab.dataset.view)history.replaceState(null,'','#'+tab.dataset.view);if(focus)tab.focus()}
tabs.forEach(function(tab,index){tab.addEventListener('click',function(){activate(tab.dataset.view)});tab.addEventListener('keydown',function(e){var next;if(e.key==='ArrowRight')next=(index+1)%tabs.length;if(e.key==='ArrowLeft')next=(index-1+tabs.length)%tabs.length;if(next!=null){e.preventDefault();activate(tabs[next].dataset.view,true)}})});var statusObserver=null;frame.addEventListener('load',function(){if(statusObserver)statusObserver.disconnect();var status=frame.contentDocument&&frame.contentDocument.getElementById('status');if(!status){loader.classList.add('hidden');return}function settle(){if(!/(building|following|initializing|loading)/i.test(status.textContent)){requestAnimationFrame(function(){requestAnimationFrame(function(){loader.classList.add('hidden')})});statusObserver.disconnect()}}statusObserver=new MutationObserver(settle);statusObserver.observe(status,{childList:true,subtree:true,characterData:true});settle()});window.addEventListener('hashchange',function(){activate(location.hash.slice(1))});activate(location.hash.slice(1)||'sched');})();
</script></body></html>
