<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070b10"><title>Kernel Study Lab</title><link rel="stylesheet" href="theme.css?v=7"></head>
<body><div id="app-shell">
<header id="app-header">
<div id="brand"><span id="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><div><h1><span>kernel</span>::lab</h1><p>trace-driven internals</p></div></div>
<nav id="view-tabs" role="tablist" aria-label="Kernel subsystems">
<button id="tab-core" class="view-tab" role="tab" aria-selected="false" tabindex="-1" data-view="core" data-src="views/core.html?v=27">SCHED</button>
<button id="tab-cfs" class="view-tab" role="tab" aria-selected="false" tabindex="-1" data-view="cfs" data-src="views/cfs-tree.html?v=20">CFS</button>
<button id="tab-mm" class="view-tab" role="tab" aria-selected="false" tabindex="-1" data-view="mm" data-src="views/mm.html?v=41">MM</button>
<button id="tab-tasks" class="view-tab" role="tab" aria-selected="false" tabindex="-1" data-view="tasks" data-src="views/module.html?v=30&amp;section=tasks">TASKS</button>
<button id="tab-layout" class="view-tab" role="tab" aria-selected="false" tabindex="-1" data-view="layout" data-src="views/module.html?v=30&amp;section=layout">LAYOUT</button>
<button id="tab-allocators" class="view-tab" role="tab" aria-selected="false" tabindex="-1" data-view="allocators" data-src="views/module.html?v=30&amp;section=allocators">ALLOCATORS</button>
</nav><div id="view-context"><span class="trace-dot" aria-hidden="true"></span><span id="view-state">CAPTURE READY</span><span id="view-description"></span></div>
</header><main id="viewer-wrap"><iframe id="viewer-frame" title="Kernel subsystem visualization"></iframe><div id="frame-loader" role="status"><span><i class="trace-dot"></i>parsing trace capture…</span></div></main>
</div><script>
(function(){'use strict';var views={core:{description:'task lifecycle · per-CPU execution'},cfs:{description:'enqueue snapshots · RB invariants'},mm:{description:'observed mm_struct · VMA topology · page tables'},tasks:{description:'task_struct inventory · ancestry · mm ownership'},layout:{description:'canonical address map · captured boundaries'},allocators:{description:'page · SLUB · vmalloc API contracts'}};var tabs=Array.prototype.slice.call(document.querySelectorAll('.view-tab')),frame=document.getElementById('viewer-frame'),description=document.getElementById('view-description'),loader=document.getElementById('frame-loader');
function activate(name,focus){var tab=tabs.filter(function(t){return t.dataset.view===name})[0]||tabs[0];tabs.forEach(function(item){var on=item===tab;item.classList.toggle('active',on);item.setAttribute('aria-selected',String(on));item.tabIndex=on?0:-1});description.textContent=views[tab.dataset.view].description;loader.classList.remove('hidden');if(frame.getAttribute('src')!==tab.dataset.src)frame.src=tab.dataset.src;if(location.hash!=='#'+tab.dataset.view)history.replaceState(null,'','#'+tab.dataset.view);if(focus)tab.focus()}
tabs.forEach(function(tab,index){tab.addEventListener('click',function(){activate(tab.dataset.view)});tab.addEventListener('keydown',function(e){var next;if(e.key==='ArrowRight')next=(index+1)%tabs.length;if(e.key==='ArrowLeft')next=(index-1+tabs.length)%tabs.length;if(next!=null){e.preventDefault();activate(tabs[next].dataset.view,true)}})});frame.addEventListener('load',function(){loader.classList.add('hidden')});window.addEventListener('hashchange',function(){activate(location.hash.slice(1))});activate(location.hash.slice(1)||'core');})();
</script></body></html>
