<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Block I/O Study Viewer</title>
  <link rel="stylesheet" href="../theme.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #070a12;
      --panel: rgba(11, 18, 32, 0.82);
      --panel-2: rgba(20, 31, 52, 0.86);
      --soft: rgba(30, 41, 59, 0.82);
      --line: rgba(148, 163, 184, 0.18);
      --text: #e8eef8;
      --muted: #91a3bb;
      --blue: #38bdf8;
      --green: #34d399;
      --orange: #f59e0b;
      --red: #fb7185;
      --purple: #a78bfa;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at 10% -10%, rgba(56, 189, 248, 0.18) 0, transparent 34rem),
        radial-gradient(circle at 90% 4%, rgba(245, 158, 11, 0.14) 0, transparent 30rem),
        linear-gradient(135deg, #070a12, #0b1020);
      color: var(--text);
      font-family: var(--sans);
      font-size: 12px;
    }

    #block-app {
      width: 100vw;
      height: 100vh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 10px;
      padding: 10px;
    }

    #toolbar, #summary, #events, #details {
      border: 1px solid var(--line);
      border-radius: 20px;
      background: rgba(15, 23, 42, 0.78);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    #toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      padding: 10px;
    }

    h1 { font-family: var(--mono); font-size: 13px; white-space: nowrap; }
    h1 span { color: var(--orange); }

    button, input, select {
      height: 30px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--soft);
      color: var(--text);
      font-family: var(--mono);
      font-size: 10px;
    }

    button { padding: 0 10px; cursor: pointer; }
    input { width: min(280px, 26vw); padding: 0 9px; }
    select { padding: 0 8px; }
    button:hover, input:hover, select:hover { border-color: #426283; }

    #status {
      margin-left: auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 10px;
    }

    #main {
      min-height: 0;
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr) 390px;
      gap: 10px;
    }

    #summary, #events, #details { min-height: 0; overflow: auto; }
    #summary, #details { padding: 12px; }
    #events { padding: 8px; }

    .section-title {
      margin-bottom: 8px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
    .stat { border: 1px solid var(--line); border-radius: 13px; background: var(--panel-2); padding: 10px; }
    .stat b { display: block; font-family: var(--mono); font-size: 18px; line-height: 1.15; }
    .stat span { color: var(--muted); font-size: 11px; }

    .count-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      padding: 7px 0;
      border-bottom: 1px solid rgba(42, 61, 88, 0.55);
      font-family: var(--mono);
      font-size: 11px;
    }

    .count-row span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .count-row b { color: var(--blue); }

    table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 10px; }
    th, td { padding: 8px 7px; border-bottom: 1px solid rgba(42, 61, 88, 0.62); text-align: left; vertical-align: top; }
    th { position: sticky; top: 0; z-index: 2; background: rgba(15, 23, 42, 0.96); color: var(--muted); font-size: 9px; text-transform: uppercase; letter-spacing: 0.06em; }
    tr { cursor: pointer; }
    tr:hover td, tr.selected td { background: rgba(56, 189, 248, 0.10); }

    .event-pill { display: inline-block; padding: 3px 7px; border: 1px solid var(--line); border-radius: 999px; background: rgba(2, 6, 23, 0.55); color: var(--blue); }
    .event-bio_submit, .event-bio_complete { color: var(--green); }
    .event-rq_create { color: var(--purple); }
    .event-rq_issue { color: var(--orange); }
    .event-rq_complete { color: var(--red); }
    .muted { color: var(--muted); }
    .mono { font-family: var(--mono); }

    .detail-card { border: 1px solid var(--line); border-radius: 14px; background: var(--panel-2); padding: 12px; }
    .detail-card h2 { margin-bottom: 10px; font-family: var(--mono); font-size: 15px; }
    .field-grid { display: grid; gap: 7px; }
    .field { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 8px; align-items: baseline; }
    .field b { color: var(--muted); font-family: var(--mono); font-size: 10px; }
    .field span { min-width: 0; overflow-wrap: anywhere; font-family: var(--mono); font-size: 11px; }
    .raw { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); color: var(--muted); font-family: var(--mono); font-size: 10px; overflow-wrap: anywhere; }
    .empty { color: var(--muted); font-family: var(--mono); font-size: 11px; }

    @media (max-width: 980px) {
      body { overflow: auto; }
      #block-app { height: auto; min-height: 100vh; }
      #toolbar { flex-wrap: wrap; }
      #status { width: 100%; margin-left: 0; }
      #main { grid-template-columns: 1fr; }
      #summary, #events, #details { max-height: none; }
      input { width: min(100%, 320px); }
    }
  </style>
</head>

<body>
  <div id="block-app">
    <div id="toolbar">
      <h1><span>Block</span> I/O</h1>
      <button id="load-button">Load Capture</button>
      <input id="file-input" type="file" accept=".txt,.log,text/plain" hidden>
      <select id="event-filter"><option value="">all events</option></select>
      <select id="op-filter"><option value="">all ops</option></select>
      <input id="filter-input" placeholder="filter disk, rq, bio, task, sector...">
      <div id="status">No data loaded</div>
    </div>

    <div id="main">
      <aside id="summary">
        <div class="section-title">Summary</div>
        <div class="stat-grid">
          <div class="stat"><b id="total-events">0</b><span>events</span></div>
          <div class="stat"><b id="total-requests">0</b><span>requests</span></div>
          <div class="stat"><b id="total-bios">0</b><span>BIOs</span></div>
          <div class="stat"><b id="total-disks">0</b><span>disks</span></div>
        </div>
        <div class="section-title">Event Counts</div>
        <div id="event-counts"></div>
      </aside>

      <main id="events">
        <table>
          <thead>
            <tr>
              <th>time</th>
              <th>event</th>
              <th>op</th>
              <th>disk</th>
              <th>sector</th>
              <th>bytes</th>
              <th>rq</th>
              <th>bio</th>
            </tr>
          </thead>
          <tbody id="event-table">
            <tr><td colspan="8" class="empty">Load `shared/_captures/vfs-hook-block-io.txt` to view block I/O events.</td></tr>
          </tbody>
        </table>
      </main>

      <aside id="details">
        <div class="section-title">Details</div>
        <div class="empty">Select an event row.</div>
      </aside>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      var blockEvents = [];
      var selectedId = null;

      function el(id) { return document.getElementById(id); }

      function escapeHtml(value) {
        return String(value == null ? '' : value).replace(/[&<>\"]/g, function (ch) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch];
        });
      }

      function parseTimestamp(line) {
        var left = line.indexOf('[');
        var right = line.indexOf(']');
        if (left >= 0 && right > left) return line.slice(left + 1, right).trim();
        return '-';
      }

      function splitFields(text) {
        return text.trim().split(/\s+/).filter(Boolean);
      }

      function parseFields(text) {
        var fields = {};
        splitFields(text).forEach(function (part) {
          var eq = part.indexOf('=');
          if (eq > 0) fields[part.slice(0, eq)] = part.slice(eq + 1);
        });
        return fields;
      }

      function parseCapture(text) {
        var events = [];
        text.split('\n').forEach(function (line, index) {
          var tag = line.indexOf('BLOCK ');
          if (tag < 0) return;
          var fields = parseFields(line.slice(tag + 'BLOCK '.length));
          events.push({
            id: String(events.length),
            line: index + 1,
            raw: line,
            time: parseTimestamp(line),
            event: fields.event || 'unknown',
            op: fields.op || '-',
            disk: fields.disk || fields.name || '-',
            rq: fields.rq || '-',
            bio: fields.bio || '-',
            fields: fields
          });
        });
        return events;
      }

      function uniqueCount(events, key) {
        var seen = {};
        events.forEach(function (event) {
          var value = event.fields[key];
          if (value && value !== '?' && value !== '-' && value !== '0000000000000000') seen[value] = true;
        });
        return Object.keys(seen).length;
      }

      function filteredEvents() {
        var eventName = el('event-filter').value;
        var op = el('op-filter').value;
        var query = el('filter-input').value.trim().toLowerCase();
        return blockEvents.filter(function (event) {
          if (eventName && event.event !== eventName) return false;
          if (op && event.op !== op) return false;
          if (!query) return true;
          return event.raw.toLowerCase().indexOf(query) >= 0;
        });
      }

      function updateFilters() {
        var currentEvent = el('event-filter').value;
        var currentOp = el('op-filter').value;
        var events = {};
        var ops = {};
        blockEvents.forEach(function (event) {
          events[event.event] = true;
          if (event.op && event.op !== '-') ops[event.op] = true;
        });
        el('event-filter').innerHTML = '<option value="">all events</option>' + Object.keys(events).sort().map(function (name) {
          return '<option value="' + escapeHtml(name) + '">' + escapeHtml(name) + '</option>';
        }).join('');
        el('op-filter').innerHTML = '<option value="">all ops</option>' + Object.keys(ops).sort().map(function (name) {
          return '<option value="' + escapeHtml(name) + '">' + escapeHtml(name) + '</option>';
        }).join('');
        el('event-filter').value = events[currentEvent] ? currentEvent : '';
        el('op-filter').value = ops[currentOp] ? currentOp : '';
      }

      function updateSummary(events) {
        var counts = {};
        events.forEach(function (event) { counts[event.event] = (counts[event.event] || 0) + 1; });
        el('total-events').textContent = String(events.length);
        el('total-requests').textContent = String(uniqueCount(events, 'rq'));
        el('total-bios').textContent = String(uniqueCount(events, 'bio'));
        el('total-disks').textContent = String(uniqueCount(events, 'disk'));
        el('event-counts').innerHTML = Object.keys(counts).sort().map(function (name) {
          return '<div class="count-row"><span>' + escapeHtml(name) + '</span><b>' + counts[name] + '</b></div>';
        }).join('') || '<div class="empty">No events</div>';
      }

      function eventClass(name) {
        return 'event-' + String(name).replace(/[^a-zA-Z0-9_]/g, '_');
      }

      function renderTable(events) {
        var rows = events.slice(0, 1200).map(function (event) {
          var selected = event.id === selectedId ? ' class="selected"' : '';
          return '<tr data-event-id="' + event.id + '"' + selected + '>' +
            '<td>' + escapeHtml(event.time) + '</td>' +
            '<td><span class="event-pill ' + eventClass(event.event) + '">' + escapeHtml(event.event) + '</span></td>' +
            '<td>' + escapeHtml(event.op) + '</td>' +
            '<td>' + escapeHtml(event.disk) + '</td>' +
            '<td>' + escapeHtml(event.fields.sector || '-') + '</td>' +
            '<td>' + escapeHtml(event.fields.bytes || '-') + '</td>' +
            '<td>' + escapeHtml(shortPtr(event.rq)) + '</td>' +
            '<td>' + escapeHtml(shortPtr(event.bio)) + '</td>' +
          '</tr>';
        }).join('');
        if (!rows) rows = '<tr><td colspan="8" class="empty">No events match the current filter.</td></tr>';
        if (events.length > 1200) rows += '<tr><td colspan="8" class="empty">Showing first 1200 of ' + events.length + ' matching events.</td></tr>';
        el('event-table').innerHTML = rows;
        Array.prototype.slice.call(el('event-table').querySelectorAll('tr[data-event-id]')).forEach(function (row) {
          row.addEventListener('click', function () { selectEvent(row.getAttribute('data-event-id')); });
        });
      }

      function shortPtr(value) {
        if (!value || value === '-') return '-';
        if (value.length <= 10) return value;
        return value.slice(0, 6) + '..' + value.slice(-4);
      }

      function render() {
        var events = filteredEvents();
        updateSummary(events);
        renderTable(events);
      }

      function selectEvent(id) {
        selectedId = id;
        var event = blockEvents.filter(function (item) { return item.id === id; })[0];
        if (!event) return;
        var fields = Object.keys(event.fields).sort().map(function (key) {
          return '<div class="field"><b>' + escapeHtml(key) + '</b><span>' + escapeHtml(event.fields[key]) + '</span></div>';
        }).join('');
        el('details').innerHTML = '<div class="section-title">Details</div><div class="detail-card"><h2>' + escapeHtml(event.event) + '</h2><div class="field-grid"><div class="field"><b>time</b><span>' + escapeHtml(event.time) + '</span></div><div class="field"><b>line</b><span>' + event.line + '</span></div>' + fields + '</div><div class="raw">' + escapeHtml(event.raw) + '</div></div>';
        render();
      }

      function loadCapture(text, label) {
        blockEvents = parseCapture(text);
        selectedId = blockEvents.length ? blockEvents[0].id : null;
        updateFilters();
        render();
        if (selectedId) selectEvent(selectedId);
        el('status').textContent = blockEvents.length + ' BLOCK events - ' + label;
      }

      el('load-button').addEventListener('click', function () { el('file-input').click(); });
      el('file-input').addEventListener('change', function () {
        var file = this.files[0];
        var reader;
        if (!file) return;
        reader = new FileReader();
        reader.onload = function (event) { loadCapture(event.target.result, file.name); };
        reader.readAsText(file);
        this.value = '';
      });
      el('event-filter').addEventListener('change', render);
      el('op-filter').addEventListener('change', render);
      el('filter-input').addEventListener('input', render);

      fetch('../../shared/_captures/vfs-hook-block-io.txt')
        .then(function (response) {
          if (!response.ok) throw new Error(String(response.status));
          return response.text();
        })
        .then(function (text) { loadCapture(text, '../shared/_captures/vfs-hook-block-io.txt'); })
        .catch(function () { el('status').textContent = 'shared/_captures/vfs-hook-block-io.txt not found - use Load Capture'; });
    })();
  </script>
</body>

</html>
