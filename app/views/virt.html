<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KVM EPT</title>
<link rel="stylesheet" href="../theme.css?v=7">
<style>
html,body{width:100%;height:100%;overflow:hidden;background:transparent}*{box-sizing:border-box}.virt{width:100%;height:100%;padding:14px 16px;display:grid;grid-template-rows:auto minmax(0,1fr);gap:10px}.head{display:flex;align-items:flex-end;gap:14px}.head h1{margin:4px 0 0;font:650 24px/1 var(--mono);letter-spacing:0}.head h1 span{color:var(--cyan)}.head p{margin:5px 0 0;color:var(--muted);font:10px/1.45 var(--mono)}#status{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--muted);font:10px var(--mono);white-space:nowrap}.workbench{min-width:0;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:10px}.panel{min-width:0;min-height:0;border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:hidden}.stage,.note{display:grid;grid-template-rows:auto minmax(0,1fr) auto}.panel-head{display:flex;align-items:center;gap:9px;padding:8px 11px;border-bottom:1px solid var(--line)}.panel-head h2{margin:0;font:600 10px var(--mono);letter-spacing:.06em;text-transform:uppercase}.panel-head span{margin-left:auto;color:var(--faint);font:8px var(--mono)}.flow{min-height:0;overflow-y:auto;overflow-x:hidden;padding:10px;background:linear-gradient(180deg,rgba(7,12,18,.68),rgba(7,12,18,.38))}.activity-card,.ept-state{min-width:0;border:1px solid rgba(54,69,80,.54);border-radius:7px;background:rgba(8,13,19,.74);overflow:hidden}.activity-card{margin-bottom:10px}.card-label{display:flex;justify-content:space-between;padding:8px 10px;border-bottom:1px solid rgba(54,69,80,.54);color:var(--muted);font:700 8px var(--mono);letter-spacing:.08em}.rows{display:grid;gap:0;min-width:0}.row{min-width:0;display:block;height:auto;min-height:80px;padding:0 8px;border:0;border-bottom:1px solid rgba(54,69,80,.28);background:transparent;cursor:pointer}.row:last-child{border-bottom:0}.row.selected{background:rgba(232,207,104,.035);box-shadow:inset 0 0 0 1px rgba(232,207,104,.58)}.transition{position:relative;width:100%;min-width:0;height:80px;background:transparent;overflow:visible}.event{position:absolute;top:27px;height:26px;min-width:0;padding:4px 5px;border:1px solid var(--line);border-radius:4px;background:rgba(13,19,27,.98);font-family:var(--mono)}.event strong{display:block;margin-bottom:3px;color:var(--text);font:800 7px/1 var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.event span{display:none}.event:after{display:none}.entry .event:after{right:-6px;border-top:4px solid transparent;border-bottom:4px solid transparent;border-left:6px solid rgba(103,232,209,.72)}.exit .event:after,.user .event:after{left:-6px;border-top:4px solid transparent;border-bottom:4px solid transparent;border-right:6px solid rgba(240,164,93,.72)}.user .event:after{border-right-color:rgba(109,221,155,.62)}.layer{position:absolute;top:0;bottom:0;width:1px;padding:0;color:transparent;font:700 7px var(--mono);text-align:center;pointer-events:none}.layer.userspace{left:8%}.layer.kvm{left:50%}.layer.guest{left:92%}.layer:before{position:absolute;left:50%;top:8px;transform:translate(-50%,-100%);color:var(--faint);font:700 7px var(--mono);white-space:nowrap}.layer.userspace:before{content:"userspace"}.layer.kvm:before{content:"KVM";color:var(--cyan)}.layer.guest:before{content:"guest";color:var(--orange)}.row:not(:first-child) .layer:before{display:none}.layer:after{content:"";position:absolute;left:0;top:0;bottom:0;border-left:1px solid rgba(111,128,142,.45)}.transition:before{content:"";position:absolute;top:40px;height:1px;background:rgba(111,128,142,.58)}.transition:after{content:"";position:absolute;top:36px;width:0;height:0;border-top:4px solid transparent;border-bottom:4px solid transparent}.entry.transition:before{left:50%;right:8%;background:rgba(103,232,209,.72)}.entry.transition:after{right:8%;border-left:6px solid rgba(103,232,209,.72)}.exit.transition:before{left:50%;right:8%;background:rgba(240,164,93,.72)}.user.transition:before{left:8%;right:50%;background:rgba(240,164,93,.72)}.exit.transition:after{left:50%;border-right:6px solid rgba(240,164,93,.72)}.user.transition:after{left:8%;border-right:6px solid rgba(240,164,93,.72)}.user.transition:before{background:rgba(109,221,155,.62)}.user.transition:after{border-right-color:rgba(109,221,155,.62)}.entry .event{left:58%;width:max-content;max-width:100px;border-color:rgba(103,232,209,.52)}.exit .event{left:42%;width:max-content;max-width:100px;border-color:rgba(240,164,93,.56)}.user .event{left:10%;width:max-content;max-width:100px;border-color:rgba(109,221,155,.50)}.path{display:none}.mode{display:none}.mode b{color:var(--muted);font-weight:700}.entry .mode b:last-child{color:var(--orange)}.exit .mode b:first-child{color:var(--orange)}.user .mode b:last-child{color:var(--green)}.row .ept{display:none}.row.selected .ept{display:grid;margin:0 -2px 8px;padding:8px;border:1px solid rgba(54,69,80,.54);border-radius:5px;background:rgba(8,13,19,.92)}.ept{min-width:0;display:grid;grid-template-rows:auto 18px;gap:5px;align-self:center}.ept-head{min-width:0;display:flex;align-items:center;gap:10px;color:var(--muted);font:8px var(--mono)}.ept-head b{color:var(--cyan);font:800 9px var(--mono)}.ept-head span{color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ept-table{min-width:0;display:grid;grid-template-columns:repeat(32,minmax(0,1fr));gap:2px}.gfn-chip{min-width:0;height:18px;border:1px solid rgba(54,69,80,.48);border-radius:2px;background:rgba(13,20,27,.72);color:var(--faint);font:700 6px/16px var(--mono);text-align:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.gfn-chip.mapped{border-color:rgba(240,164,93,.34);background:rgba(83,52,26,.18);color:#d7ad80}.gfn-chip.empty{opacity:.38}.delta{display:none;height:15px;color:#d8c47a;font:700 8px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.delta.none{color:var(--faint)}.legend{display:flex;align-items:center;gap:12px;padding:7px 10px;border-top:1px solid var(--line);color:var(--muted);font:8px var(--mono)}.sw{display:inline-block;width:12px;height:5px;margin-right:5px;border-radius:2px}.sw.entry{background:var(--cyan)}.sw.exit{background:var(--orange)}.sw.user{background:var(--green)}.sw.ept{background:var(--yellow)}.note-body{padding:10px;overflow:auto}.type{display:flex;align-items:center;gap:7px;color:var(--cyan);font:10px var(--mono);letter-spacing:.06em;text-transform:uppercase}.note h2{margin:7px 0 9px;font:650 17px/1.2 var(--mono);letter-spacing:0}.fields{display:grid;grid-template-columns:104px minmax(0,1fr);border:1px solid var(--line);border-radius:6px;overflow:hidden}.fields dt,.fields dd{margin:0;padding:5px 7px;border-bottom:1px solid var(--line);font:8px var(--mono)}.fields dt{color:var(--cyan);background:var(--panel-2)}.fields dd{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}.walk-card{margin-top:10px;border:1px solid var(--line);border-radius:6px;overflow:hidden}.walk-card h3{margin:0;padding:6px 7px;border-bottom:1px solid var(--line);font:750 8px var(--mono);color:var(--text);background:rgba(13,20,27,.72)}.walk-row{display:grid;grid-template-columns:44px repeat(4,1fr) 58px;gap:3px;padding:5px;border-bottom:1px solid rgba(54,69,80,.34)}.walk-row:last-child{border-bottom:0}.cell{min-width:0;padding:4px;border:1px solid rgba(54,69,80,.62);border-radius:3px;background:rgba(13,20,27,.72);font:6.4px/1.2 var(--mono);overflow:hidden}.cell strong{display:block;color:var(--text);font:750 6.7px var(--mono)}.cell span{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cell.on{border-color:rgba(103,232,209,.42);background:rgba(30,68,76,.24)}.cell.leaf{border-color:rgba(240,164,93,.50);background:rgba(83,52,26,.22)}.cell.off{opacity:.42}@media(max-width:1050px){html,body{height:auto;overflow:auto}.virt{height:auto;min-height:100vh}.workbench{grid-template-columns:1fr}.note{min-height:420px}.row{grid-template-columns:1fr}.path{display:none}}

.flow{min-height:0;overflow:hidden;padding:10px;display:grid;grid-template-columns:minmax(320px,38%) minmax(0,1fr);gap:10px;background:rgba(7,12,18,.44)}
.activity-card,.ept-card{min-width:0;min-height:0;margin:0;border:1px solid rgba(54,69,80,.54);border-radius:7px;background:rgba(8,13,19,.74);overflow:hidden;display:grid;grid-template-rows:auto minmax(0,1fr)}
.rows{min-height:0;overflow-y:auto;overflow-x:hidden}
.row{height:80px;min-height:80px;padding:0 8px;border:0;border-bottom:1px solid rgba(54,69,80,.28);background:transparent;cursor:default}
.row:last-child{border-bottom:0}
.row.selected{background:transparent;box-shadow:none}
.event{cursor:pointer}
.event.selected{border-color:var(--yellow);box-shadow:0 0 0 1px rgba(232,207,104,.25)}
.ept-state-body{min-width:0;min-height:0;overflow-y:auto;overflow-x:hidden;padding:10px}
.ept-state-body .ept-head{margin-bottom:8px}
.ept-state-body .ept-table{width:100%}
@media(max-width:1050px){.flow{grid-template-columns:1fr;overflow:visible}.activity-card{height:520px}.ept-card{min-height:280px}}

.row{height:56px;min-height:56px}
.transition{height:56px}
.transition:before{top:28px}
.transition:after{top:24px}
.event{top:15px;display:flex;align-items:center;height:26px;max-width:160px}
.event strong{margin:0}
.entry .event,.exit .event{left:71%;transform:translateX(-50%)}
.user .event{left:29%;transform:translateX(-50%)}

.gfn-chip.mmio{border-color:rgba(216,196,122,.58);background:rgba(86,73,26,.24);color:#e4cf78}
.cell.mmio{border-color:rgba(216,196,122,.58);background:rgba(86,73,26,.20)}
.cell.mmio strong,.cell.mmio span{color:#e4cf78}

.ept-card{grid-template-rows:auto auto minmax(0,1fr)}
.ept-legend{display:flex;align-items:center;gap:14px;padding:6px 10px;border-bottom:1px solid rgba(54,69,80,.40);color:var(--muted);font:700 7px var(--mono)}
.ept-legend span{display:flex;align-items:center;gap:5px}
.ept-key{width:10px;height:6px;border:1px solid rgba(83,96,108,.62);border-radius:2px;background:rgba(50,59,68,.30)}
.ept-key.table{border-color:rgba(99,199,211,.62);background:rgba(34,104,113,.42)}
.ept-key.ram{border-color:rgba(112,201,148,.68);background:rgba(35,105,64,.46)}
.ept-key.mmio{border-color:rgba(230,164,95,.72);background:rgba(123,72,27,.46)}
.gfn-chip.mapped{border-color:rgba(112,201,148,.58);background:rgba(35,105,64,.26);color:#83d5a5}
.gfn-chip.mmio{border-color:rgba(230,164,95,.68);background:rgba(123,72,27,.28);color:#e9ad6c}
.cell.on{border-color:rgba(99,199,211,.48);background:rgba(34,104,113,.20)}
.cell.leaf{border-color:rgba(112,201,148,.58);background:rgba(35,105,64,.22)}
.cell.leaf strong,.cell.leaf span{color:#83d5a5}
.cell.mmio{border-color:rgba(230,164,95,.68);background:rgba(123,72,27,.22)}
.cell.mmio strong,.cell.mmio span{color:#e9ad6c}

.leaf-row{display:grid;grid-template-columns:66px repeat(4,minmax(0,1fr)) 70px;gap:4px;padding:4px 7px;border-bottom:1px solid rgba(54,69,80,.30)}
.leaf-row:last-child{border-bottom:0}
.ept-state-body>.walk-card{margin-top:8px}
</style>
</head>
<body>
<main class="virt">
<header class="head"><div><div class="eyebrow">VIRT / 01-KVM / EPT</div><h1>KVM <span>EPT</span></h1><p>KVM transitions and EPT state from the same run.</p></div><div id="status" role="status"><i class="trace-dot"></i><span>autoloading captures...</span></div></header>
<section class="workbench"><section class="panel stage"><header class="panel-head"><h2>KVM EPT</h2><span id="flow-summary">-</span></header><div class="flow"><section class="activity-card"><div class="card-label"><span>EXECUTION FLOW</span></div><div id="timeline" class="rows"></div></section><section class="ept-card"><div class="card-label"><span>EPT STATE</span><span id="ept-event">-</span></div><div class="ept-legend"><span><i class="ept-key empty"></i>EMPTY</span><span><i class="ept-key table"></i>TABLE</span><span><i class="ept-key ram"></i>RAM</span><span><i class="ept-key mmio"></i>MMIO</span></div><div class="ept-state-body"><div id="ept-state"></div><div id="walk-detail" class="walk-card"></div></div></section></div><footer class="legend"><span><i class="sw entry"></i>VM entry</span><span><i class="sw exit"></i>VM exit</span><span><i class="sw user"></i>userspace</span></footer></section><aside class="panel note"><header class="panel-head"><h2>Selected event</h2></header><div class="note-body"><div class="type"><i class="trace-dot"></i><span id="detail-type">capture</span></div><h2 id="detail-title">Loading captures</h2><dl class="fields" id="fields"><dt>status</dt><dd>waiting</dd></dl></div></aside></section>
</main>
<script>
(function(){'use strict';
var TRACE_PATH='../../shared/_captures/01-kvm-trace.txt?v='+Date.now(),EPT_PATH='../../shared/_captures/ept.ndjson?v='+Date.now();
var events=[],frames=[],selected=0,selectedGfn=0;
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'-':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function short(x){x=String(x||'0x0');return x.length>13?x.slice(0,8)+'...'+x.slice(-4):x}
function endpoints(e){if(e.type==='kvm_entry')return{from:'root',to:'guest'};if(e.type==='kvm_userspace_exit')return{from:'root',to:'userspace'};return{from:'guest',to:'root'}}
function parseTrace(text){return text.split(/\r?\n/).map(function(raw){var m=raw.match(/^\s*(\S+)-(\d+)\s+\[(\d+)\]\s+(\S+)\s+([0-9.]+):\s+(kvm_entry|kvm_exit|kvm_userspace_exit):\s+(.+)$/);if(!m)return null;var e={task:m[1],pid:+m[2],cpu:+m[3],flags:m[4],time:+m[5],type:m[6],body:m[7],fields:{}};if(e.type==='kvm_entry'){var en=e.body.match(/vcpu\s+(\d+),\s+rip\s+(0x[0-9a-f]+)/i);if(en){e.fields.vcpu_id=en[1];e.fields.rip=en[2]}}else if(e.type==='kvm_userspace_exit'){var ux=e.body.match(/reason\s+(.+)$/i);if(ux)e.fields.reason=ux[1]}else{var ex=e.body.match(/vcpu\s+(\d+)\s+reason\s+([^\s]+)\s+rip\s+(0x[0-9a-f]+)\s+info1\s+(0x[0-9a-f]+)\s+info2\s+(0x[0-9a-f]+)\s+intr_info\s+(0x[0-9a-f]+)\s+error_code\s+(0x[0-9a-f]+)/i);if(ex){e.fields.vcpu_id=ex[1];e.fields.exit_reason=ex[2];e.fields.rip=ex[3];e.fields.info1=ex[4];e.fields.info2=ex[5];e.fields.intr_info=ex[6];e.fields.error_code=ex[7]}}var ep=endpoints(e);e.from=ep.from;e.to=ep.to;return e}).filter(Boolean)}
function parseEpt(text){var out=[];text.split(/\r?\n/).forEach(function(line){if(!line.trim())return;try{var r=JSON.parse(line);if(r.type==='vcpu_mm_snapshot')out.push(r)}catch(ignore){}});return out.sort(function(a,b){return Number(a.sequence)-Number(b.sequence)})}
function flowLabel(e){if(e.type==='kvm_entry')return 'entry';if(e.type==='kvm_userspace_exit')return (e.fields.reason||'KVM_EXIT_*').replace(/^KVM_EXIT_/,'').replace(/ \(.*\)$/,'');return e.fields.exit_reason||'exit'}
function flowClass(e){return e.type==='kvm_entry'?'entry':e.type==='kvm_userspace_exit'?'user':'exit'}
function detailTitle(e){if(e.type==='kvm_exit')return 'kvm_exit: '+(e.fields.exit_reason||'unknown');if(e.type==='kvm_userspace_exit')return 'kvm_userspace_exit: '+(e.fields.reason||'unknown');return 'kvm_entry'}
function mappedSet(f){var set=new Set;(f&&f.gfns||[]).forEach(function(g){if(g.ept_mapped)set.add(String(g.gfn))});return set}
function mappedCount(f){return mappedSet(f).size}
function mmioCount(f){return (f&&f.gfns||[]).filter(function(g){return g.ept_mmio}).length}
function eptDelta(i){var now=mappedSet(frames[i]),prev=mappedSet(frames[i-1]),added=[];now.forEach(function(g){if(!prev.has(g))added.push(g)});return added}
function levelName(level){return level===4?'PML4':level===3?'PDPT':level===2?'PD':'PT'}
function eventHtml(e,i){var k=flowClass(e);return '<div class="transition '+k+'"><div class="layer userspace"></div><div class="layer kvm"></div><div class="layer guest"></div><button class="event" data-index="'+i+'" type="button" title="'+esc(e.from+' -> '+e.to)+'"><strong>'+esc(flowLabel(e))+'</strong></button></div>'}
function render(){var root=$('timeline');root.innerHTML=events.map(function(e,i){return '<div class="row '+flowClass(e)+'">'+eventHtml(e,i)+'</div>'}).join('');root.querySelectorAll('.event').forEach(function(button){button.onclick=function(){select(+button.dataset.index)}});$('flow-summary').textContent=events.length+' tracepoints / '+frames.length+' EPT snapshots';select(selected)}
function perms(e){return (e.r?'r':'-')+(e.w?'w':'-')+(e.x?'x':'-')}
function walkCell(e){var cls='cell '+(e.mmio?'mmio':!e.present?'off':e.leaf?'leaf':'on');return'<div class="'+cls+'"><strong>'+esc(levelName(e.level))+'['+esc(e.index)+']</strong><span>'+(e.mmio?'MMIO ':perms(e)+' ')+short(e.spte)+'</span></div>'}
function renderWalk(f){var gfns=f.gfns||[];if(!gfns.length){$('walk-detail').innerHTML='';return}$('walk-detail').innerHTML=gfns.map(function(g){var state=g.ept_mmio?'mmio':g.ept_mapped?'leaf':'off';return'<div class="leaf-row"><div class="cell '+state+'"><strong>GFN '+esc(g.gfn)+'</strong><span>'+short(g.gpa)+'</span></div>'+g.entries.map(walkCell).join('')+'<div class="cell '+state+'"><strong>PFN</strong><span>'+(g.ept_mmio?'MMIO':g.ept_mapped?short(g.leaf_pfn):'-')+'</span></div></div>'}).join('')}
function select(i){selected=Math.max(0,Math.min(events.length-1,i));document.querySelectorAll('.event').forEach(function(button){button.classList.toggle('selected',+button.dataset.index===selected)});var e=events[selected],f=frames[selected]||{},added=eptDelta(selected),fields={trace_event:f.trace_event||e.type,transition:e.from+' -> '+e.to,ept_mapped:mappedCount(f),ept_mmio:mmioCount(f),ept_delta:added.join(',')||'none',root_hpa:f.root_hpa,vcpu:f.vcpu};Object.keys(e.fields).forEach(function(k){fields[k]=e.fields[k]});$('detail-type').textContent=f.trace_event||e.type;$('detail-title').textContent=detailTitle(e);$('fields').innerHTML=Object.keys(fields).map(function(k){return'<dt>'+esc(k)+'</dt><dd title="'+esc(fields[k])+'">'+esc(fields[k])+'</dd>'}).join('');$('ept-event').textContent=f.trace_event||e.type;$('ept-state').innerHTML='<div class="ept-head"><b>'+mappedCount(f)+' RAM</b><span>'+mmioCount(f)+' MMIO / 32 GFN</span></div>';renderWalk(f)}
Promise.all([fetch(TRACE_PATH,{cache:'no-store'}).then(function(r){if(!r.ok)throw Error('trace HTTP '+r.status);return r.text()}),fetch(EPT_PATH,{cache:'no-store'}).then(function(r){if(!r.ok)throw Error('ept HTTP '+r.status);return r.text()})]).then(function(parts){events=parseTrace(parts[0]);frames=parseEpt(parts[1]);if(!events.length)throw Error('no KVM trace events parsed');if(!frames.length)throw Error('no EPT snapshots parsed');$('status').innerHTML='<i class="trace-dot"></i><span>'+events.length+' trace events · '+frames.length+' EPT snapshots</span>';render()}).catch(function(err){$('status').textContent='capture error · '+err.message;$('detail-title').textContent='Capture unavailable';$('fields').innerHTML='<dt>error</dt><dd>'+esc(err.message)+'</dd>'});
})();
</script>
</body>
</html>
