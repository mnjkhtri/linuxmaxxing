<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Linux PCI I/O</title>
<link rel="stylesheet" href="../../theme.css">
<link rel="stylesheet" href="io.css">
</head>
<body>
<main class="io-flow">
<header class="hero page-head">
<div>
<h1>PCI I/O</h1>
<p>Trigger, driver dispatch, MMIO/DMA, interrupts, and completion</p>
</div>
<div id="io-summary" role="status" aria-label="IO capture summary"><i class="trace-dot"></i><span id="io-summary-text">building IO model…</span></div>
</header>


<section class="workspace">
<div class="flow-column">
<section class="panel journey-panel">
<header class="journey-head">
<div class="journey-resources" id="journey-resources" aria-label="Trace resources"></div>
</header>

<nav class="step-roadmap experiment-selector" id="step-roadmap" aria-label="IO phases"></nav>

<div class="active-flow">
<div class="sequence-diagram">
<div class="sequence-head" id="sequence-head"></div>
<div class="sequence-body" id="sequence-body"></div>
</div>
</div>

</section>

</div>

<aside class="panel inspector inspector-pane">
<div class="inspector-body">
<section class="origin-card inspector-section">
<h3>Origin</h3>
<div class="origin-grid" id="inspect-origin"></div>
</section>
<section class="field-card">
<h3>Fields</h3>
<div class="origin-grid" id="inspect-fields"></div>
</section>
</div>
</aside>
</section>
</main>
<script type="module" src="io.js"></script>
</body>
</html>
