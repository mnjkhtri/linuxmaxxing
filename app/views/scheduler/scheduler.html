<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CFS per-CPU runqueues</title>
  <link rel="stylesheet" href="../../theme.css">
  <link rel="stylesheet" href="scheduler.css">
</head>

<body>
  <main class="cfs">

    <header class="head page-head">
      <div>
        <h1>CFS runqueue</h1>
        <p>Per-CPU cfs_rq state</p>
      </div>
      <div id="status" role="status">
        <i class="trace-dot"></i><span>following scheduler evolution…</span>
      </div>
    </header>

    <section class="workbench">

      <aside class="panel life-rail">
        <div class="life-canvas" id="life-canvas" role="img" aria-label="Task lifetimes aligned with CFS state changes">
        </div>
      </aside>

      <div class="trees" id="trees"></div>

    </section>

    <nav class="panel toolbar playback-bar cfs-player" aria-label="Global capture playback">
      <span id="record-count" class="playback-records">— records</span>
      <div class="playback-controls">
        <button id="prev">Prev</button>
        <button id="play">Play</button>
        <button id="next">Next</button>
        <input id="scrub" class="playback-scrub" type="range" min="0" max="0" value="0" aria-label="Global capture frame">
        <span id="counter" class="playback-counter">— / —</span>
        <span class="sep playback-sep"></span>
        <select id="speed" class="playback-speed" aria-label="Playback speed">
          <option value="1">1 event/s</option>
          <option value="25">25 events/s</option>
          <option value="100">100 events/s</option>
        </select>
      </div>
    </nav>

  </main>
  <script type="module" src="scheduler.js"></script>
</body>

</html>
