<!doctype html>
<!-- SPDX-License-Identifier: GPL-2.0 -->
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>VT·D</title>
    <link rel="stylesheet" href="../../theme.css?v=ui-16">
    <link rel="stylesheet" href="virt-vtd.css?v=ui-16">
</head>
<body>
<main class="vtd">
    <header class="hero page-head">
        <div>
            <h1>VT·D</h1>
            <p>PCIe ownership, DMA, interrupt remapping, and translation</p>
        </div>
        <div id="status" role="status"><i class="trace-dot"></i><span>Loading capture…</span></div>
    </header>

    <section class="laboratory">
        <nav id="roadmap" class="roadmap panel experiment-selector" aria-label="VT-d phases and captured events">
            <div class="selector-option future" aria-hidden="true">
                <span class="selector-kicker">NO CAPTURE</span>
                <span class="selector-label">COLLECT FIRST</span>
            </div>
        </nav>

        <section class="machine">
            <div class="machine-body">
                <section class="mechanism">
                    <div id="phase-a-state" class="phase-state dma-state">
                        <section class="interaction-view region execution">
                            <header class="interaction-head region-title">
                                <div><b>LIFELINES</b><span id="lifelines-caption">Phase A</span></div>
                            </header>
                            <div id="actor-row" class="actor-row"></div>
                            <div class="interaction-canvas">
                                <div id="lifeline-lines" class="lifeline-lines" aria-hidden="true"></div>
                                <div id="interaction-rows" class="interaction-rows"></div>
                            </div>
                        </section>

                        <section class="chunk-view state-view region">
                            <header class="region-title">
                                <div><b id="state-title">ADDRESS SPACE</b><span id="state-caption">State at the selected boundary.</span></div>
                                <code id="state-status">—</code>
                            </header>
                            <div id="event-scope" class="event-scope" role="group" aria-label="Lifeline event scope">
                                <button type="button" data-event-scope="workload" aria-pressed="true"><span>WORKLOAD</span><small id="scope-workload-count">—</small></button>
                                <button type="button" data-event-scope="all" aria-pressed="false"><span>ALL CAPTURED</span><small id="scope-all-count">—</small></button>
                            </div>
                            <div id="state-rows" class="state-rows"></div>
                            <div id="map-picker" class="side-map-picker">
                                <label for="map-select">Inspect VFIO range</label>
                                <div class="select-shell"><select id="map-select"></select></div>
                                <span id="map-summary">—</span>
                            </div>
                            <section id="state-map-browser" class="state-map-browser">
                                <header><span>IOMMU LEAVES</span><code id="chunk-count">—</code></header>
                                <div id="chunk-caption" class="map-caption">Select a captured mapping.</div>
                                <div class="range-axis"><code id="range-start">—</code><span>IOVA range</span><code id="range-end">—</code></div>
                                <div id="chunk-list" class="chunk-list"></div>
                            </section>
                        </section>
                    </div>
                </section>
            </div>
        </section>

        <aside class="inspector inspector-pane panel">
            <div class="inspector-body">
                <section class="origin-card inspector-section">
                    <h3>Origin</h3>
                    <div id="event-origin" class="origin-grid"></div>
                </section>
                <section class="field-card">
                    <h3>Fields</h3>
                    <div id="fields" class="origin-grid"></div>
                </section>
            </div>
            <footer class="inspector-footer playback-bar">
                <button id="prev" type="button" aria-label="previous event">Prev</button>
                <button id="play" type="button" aria-label="play">Play</button>
                <button id="next" type="button" aria-label="next event">Next</button>
                <input id="scrub" class="playback-scrub" type="range" min="0" value="0" aria-label="captured event scrubber">
                <span id="counter" class="playback-counter">0 / 0</span>
            </footer>
        </aside>
    </section>
</main>
    <script type="module" src="virt-vtd.js?v=ui-16" onerror="document.querySelector('#status span').textContent='View failed to load'"></script>
</body>
</html>
