<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CFS RB Tree Visualizer</title>
<link rel="stylesheet" href="../theme.css?v=3">
<!-- The page is intentionally split into three responsibilities: CSS provides
     the inspection surface, the markup provides controls and SVG, and
     the script converts one NDJSON event into one isolated tree frame. -->
<style>
  html,body{width:100%;height:100%;overflow:hidden;font-size:12px}#app{width:100vw;height:100vh;padding:10px;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:10px}#header,#tree-panel,#toolbar{border:1px solid var(--line);border-radius:6px;background:var(--panel);}#header{display:flex;align-items:center;gap:10px;min-width:0;padding:10px}h1{font-family:var(--mono);font-size:13px;white-space:nowrap}h1 span{color:var(--orange)}.badge{padding:4px 8px;border:1px solid var(--line);border-radius:5px;background:var(--soft);color:var(--muted);font-family:var(--mono);font-size:10px;white-space:nowrap}#load-status{margin-left:auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-family:var(--mono);font-size:10px}#load-status.ok{color:var(--green)}#load-status.err{color:var(--red)}#tree-panel{min-height:0;overflow:hidden;display:grid;grid-template-rows:minmax(0,1fr) auto}#svg-wrap{position:relative;min-height:0;overflow:hidden;background:var(--panel);background-size:32px 32px}#tree-svg{width:100%;height:100%;display:block}#empty-msg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:10px 14px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--muted);font-family:var(--mono)}#tree-info{display:flex;align-items:center;gap:12px;min-width:0;padding:8px 10px;border-top:1px solid var(--line);color:var(--muted);font-family:var(--mono);font-size:10px;white-space:nowrap;overflow:hidden}#tree-info span{overflow:hidden;text-overflow:ellipsis}#info-event{flex:1;min-width:0;color:var(--text)}#toolbar{justify-self:center;display:inline-flex;align-items:center;gap:6px;max-width:calc(100vw - 20px);padding:8px}button,select,input[type=range]{height:28px;font-family:var(--mono);font-size:10px}button,select{border:1px solid var(--line);border-radius:10px;background:var(--soft);color:var(--text);cursor:pointer}button{padding:0 10px}select{padding:0 8px}button.active{border-color:var(--blue);background:var(--blue);color:#fff}#scrub{width:220px;accent-color:var(--blue)}#pos-counter,#time-counter{color:var(--muted);font-family:var(--mono);font-size:10px;white-space:nowrap}#time-counter{color:var(--text)}.sep{width:1px;height:20px;background:var(--line)}.edge-line{stroke:#aeb6bd;stroke-width:1.4}.node-circle{stroke-width:2;fill:#fff}.node-circle.color-R{stroke:var(--red);fill:#fff5f4}.node-circle.color-B{stroke:#32383d;fill:#f7f8f8}.node-circle.highlighted{stroke:var(--blue)!important;stroke-width:3!important}.node-circle.current{stroke:var(--yellow)!important;stroke-width:3!important}.node-circle.leftmost{filter:drop-shadow(0 0 6px rgba(52,211,153,.85))}.node-label{font-family:var(--mono);fill:var(--muted);font-size:8.5px;text-anchor:middle;pointer-events:none}.node-label.lbl-comm{fill:var(--text);font-size:9px;font-weight:700}.node-label.lbl-color-R{fill:var(--red)}.node-label.lbl-color-B{fill:var(--muted)}@media(max-width:820px){html,body{overflow:auto}#app{height:auto;min-height:100vh}#header,#toolbar{flex-wrap:wrap}#load-status{width:100%;margin-left:0}#tree-panel{min-height:520px}#scrub{width:min(220px,46vw)}}
</style>
</head>
<body>
<div id="app"><header id="header"><h1><span>CFS</span> RB Tree Visualizer</h1><div class="badge">snapshot frames</div><div class="badge">left/right links</div><div id="load-status">loading shared/_captures/ebpf-cfs_tree-rbtree.ndjson...</div><details class="info"><summary aria-label="Explain CFS tree view">i</summary><div class="info-note"><b>One frame = tree after enqueue.</b><br>Lines: child links · Border: RB color<br>Green glow: leftmost task</div></details></header><section id="tree-panel"><div id="svg-wrap"><svg id="tree-svg" xmlns="http://www.w3.org/2000/svg"></svg><div id="empty-msg">Loading CFS tree snapshots...</div></div><div id="tree-info"><span id="info-nodes">Nodes: -</span><span id="info-depth">Depth: -</span><span id="info-root">Root: -</span><span id="info-event">Event: -</span></div></section><nav id="toolbar"><button id="btn-load">Load Log</button><input type="file" id="file-input" accept=".ndjson,.json,.log,.txt,text/plain" hidden><div class="sep"></div><select id="filter-sel"><option value="all">all</option><option value="enqueue">enqueue</option><option value="dequeue">dequeue</option></select><select id="speed-sel"><option value="1000">1/s</option><option value="500">2/s</option><option value="200">5/s</option><option value="100">10/s</option><option value="25">40/s</option></select><div class="sep"></div><button id="btn-prev">Prev</button><button id="btn-play">Play</button><button id="btn-next">Next</button><div class="sep"></div><input type="range" id="scrub" min="0" max="0" value="0"><div id="pos-counter">- / -</div><div id="time-counter">t: -</div></nav></div>
<!-- The renderer never dereferences kernel addresses. It treats node addresses
     as per-capture string identifiers and draws only links present in the same
     event, so truncated snapshots cannot accidentally inherit stale nodes. -->
<script>
(function(){'use strict';var ZERO='0000000000000000',R=23,NS='http://www.w3.org/2000/svg',MAX_FRAMES=12000,all=[],filtered=[],idx=-1,playing=false,timer=null,speed=1000,raf=null,last={};function el(id){return document.getElementById(id)}function se(n){return document.createElementNS(NS,n)}function valid(a){return !!a&&a!==ZERO&&a!=='(null)'&&a!=='0x0'}function short(a){return valid(a)?'...'+String(a).slice(-6):'null'}function time(line){var m=line.match(/^\[\s*([^\]]+)\]/);return m?m[1].trim():'-'}function kv(s){var o={};s.trim().split(/\s+/).forEach(function(p){var e=p.indexOf('=');if(e>0)o[p.slice(0,e)]=p.slice(e+1)});return o}function frame(frames,order,seq,t,line){if(!frames[seq]){frames[seq]={time:t,seq:seq,event:'?',cpu:'-',cfs_rq:'-',root:null,leftmost:null,focus:null,curr:null,nodeMap:{},firstLine:line,node_count:0};order.push(seq)}return frames[seq]}function inferRoot(map){var child={};Object.keys(map).forEach(function(a){if(map[a].left)child[map[a].left]=true;if(map[a].right)child[map[a].right]=true});return Object.keys(map).filter(function(a){return !child[a]})[0]||Object.keys(map)[0]||null}function parse(text){var frames=[],lines=text.split("\n"),limited=false;for(var i=0;i<lines.length;i++){if(frames.length>=MAX_FRAMES){limited=true;break}var line=lines[i].trim(),e;if(!line)continue;try{e=JSON.parse(line)}catch(err){continue}if(e.type!=="event")continue;var map={};(e.nodes||[]).forEach(function(n){if(!valid(n.node))return;map[n.node]={node:n.node,left:valid(n.left)?n.left:null,right:valid(n.right)?n.right:null,color:(n.color===0||n.color==="R")?"R":"B",comm:n.comm||"?",pid:n.pid==null?0:n.pid,curr:n.changed===true}});if(!Object.keys(map).length&&!valid(e.root))continue;var frame={time:String(e.seq||i),seq:String(e.seq||i),event:e.op||"?",cpu:e.cpu==null?"-":e.cpu,cfs_rq:e.cfs_rq||"-",root:valid(e.root)?e.root:null,leftmost:valid(e.leftmost)?e.leftmost:null,changed_comm:e.changed_comm||"?",changed_pid:e.changed_pid||0,truncated:!!e.truncated,focus:valid(e.changed_node)?e.changed_node:null,curr:null,nodeMap:map,node_count:Object.keys(map).length};frames.push(frame)}parse.limited=limited;return frames}function layout(map,root){if(!valid(root)||!map[root])root=inferRoot(map);if(!root)return{nodes:[],edges:[],depth:0};var svg=el('tree-svg'),w=svg.clientWidth||900,h=svg.clientHeight||420,raw={},seen={},slot=0,maxD=0;function dfs(a,d){if(!valid(a)||!map[a]||seen[a])return null;seen[a]=true;var n=map[a],l=dfs(n.left,d+1),r=dfs(n.right,d+1),s;if(l===null&&r===null)s=slot++;else if(l!==null&&r!==null)s=(l+r)/2;else if(l!==null)s=l+.75;else s=r-.75;raw[a]={slot:s,depth:d};maxD=Math.max(maxD,d);return s}dfs(root,0);var keys=Object.keys(raw),min=raw[keys[0]].slot,max=min,target={},nodes=[],edges=[],xp=R+34,yp=R+22;keys.forEach(function(k){min=Math.min(min,raw[k].slot);max=Math.max(max,raw[k].slot)});keys.forEach(function(a){target[a]={x:keys.length===1?w/2:xp+((raw[a].slot-min)/Math.max(1,max-min))*(w-xp*2),y:maxD===0?h/2:yp+(raw[a].depth/Math.max(1,maxD))*(h-yp*2)}});keys.forEach(function(a){var n=map[a];if(n.left&&target[n.left])edges.push({from:a,to:n.left});if(n.right&&target[n.right])edges.push({from:a,to:n.right});nodes.push({addr:a,x:target[a].x,y:target[a].y,color:n.color||'B',comm:n.comm||'?',pid:n.pid||'?',curr:!!n.curr})});return{nodes:nodes,edges:edges,depth:maxD+1}}function draw(svg,f,laid,pos,hi){while(svg.firstChild)svg.removeChild(svg.firstChild);laid.edges.forEach(function(e){var a=pos[e.from],b=pos[e.to];if(!a||!b)return;var l=se('line');l.setAttribute('x1',a.x.toFixed(1));l.setAttribute('y1',a.y.toFixed(1));l.setAttribute('x2',b.x.toFixed(1));l.setAttribute('y2',b.y.toFixed(1));l.setAttribute('class','edge-line');svg.appendChild(l)});laid.nodes.forEach(function(n){var p=pos[n.addr];if(!p)return;var g=se('g'),c=se('circle'),cls='node-circle color-'+n.color;if(n.addr===hi)cls+=' highlighted';if(n.curr)cls+=' current';if(n.addr===f.leftmost)cls+=' leftmost';c.setAttribute('cx',p.x.toFixed(1));c.setAttribute('cy',p.y.toFixed(1));c.setAttribute('r',R);c.setAttribute('class',cls);g.appendChild(c);[['lbl-comm',n.comm.length>9?n.comm.slice(0,8)+'.':n.comm,-7],['',short(n.addr),4],['lbl-color-'+n.color,n.curr?'curr':(n.color==='R'?'red':'blk'),14]].forEach(function(t){var x=se('text');x.setAttribute('x',p.x.toFixed(1));x.setAttribute('y',(p.y+t[2]).toFixed(1));x.setAttribute('class','node-label '+t[0]);x.textContent=t[1];g.appendChild(x)});svg.appendChild(g)})}function renderTree(f){var svg=el('tree-svg'),w=svg.clientWidth||900,h=svg.clientHeight||420;svg.setAttribute('viewBox','0 0 '+w+' '+h);if(raf)cancelAnimationFrame(raf);if(!f){while(svg.firstChild)svg.removeChild(svg.firstChild);last={};el('info-nodes').textContent='Nodes: 0';el('info-depth').textContent='Depth: 0';el('info-root').textContent='Root: -';return}var laid=layout(f.nodeMap,f.root),target={},keys,start={},dur=playing?0:180,st=performance.now();laid.nodes.forEach(function(n){target[n.addr]={x:n.x,y:n.y}});keys=Object.keys(target);keys.forEach(function(a){start[a]=last[a]||target[a]});function step(now){var t=dur===0?1:Math.min(1,(now-st)/dur),ease=t*t*(3-2*t),pos={};keys.forEach(function(a){pos[a]={x:start[a].x+(target[a].x-start[a].x)*ease,y:start[a].y+(target[a].y-start[a].y)*ease}});draw(svg,f,laid,pos,f.focus);last=pos;if(t<1)raf=requestAnimationFrame(step)}step(st);el('info-nodes').textContent='Nodes: '+f.node_count;el('info-depth').textContent='Depth: '+laid.depth;el('info-root').textContent='Root: '+short(f.root)}function elapsed(f){if(!f||!filtered.length)return'-';var a=parseFloat(filtered[0].time),b=parseFloat(f.time);return isFinite(a)&&isFinite(b)?'+'+(b-a).toFixed(6)+'s':'-'}function info(f){if(!f){el('info-event').textContent='Event: -';return}var task=(f.changed_comm||"?")+" pid="+(f.changed_pid||0);el('info-event').textContent='Event: '+f.event+' | time='+f.time+' | dt='+elapsed(f)+' | seq='+f.seq+' | task='+task+' | left='+short(f.leftmost)}function renderAt(i){if(!filtered.length){idx=-1;el('pos-counter').textContent='- / -';el('time-counter').textContent='t: -';el('empty-msg').style.display='block';renderTree(null);info(null);return}idx=Math.max(0,Math.min(i,filtered.length-1));el('scrub').value=String(idx);el('pos-counter').textContent=(idx+1)+' / '+filtered.length;el('time-counter').textContent='t: '+elapsed(filtered[idx]);el('empty-msg').style.display='none';renderTree(filtered[idx]);info(filtered[idx])}function applyFilter(){var v=el('filter-sel').value;filtered=v==='all'?all.slice():all.filter(function(f){return f.event===v});last={};el('scrub').max=String(Math.max(0,filtered.length-1));renderAt(0)}function setPlay(v){playing=v;el('btn-play').textContent=playing?'Pause':'Play';el('btn-play').classList.toggle('active',playing);if(timer)clearTimeout(timer);if(playing)schedule()}function schedule(){if(!playing)return;timer=setTimeout(function(){if(idx>=filtered.length-1){setPlay(false);return}renderAt(idx+1);schedule()},speed)}function loadData(text,label){all=parse(text);filtered=all.slice();last={};el("filter-sel").value="all";el("scrub").max=String(Math.max(0,filtered.length-1));var best=0;for(var i=1;i<filtered.length;i++)if(filtered[i].node_count>filtered[best].node_count)best=i;el("load-status").textContent=all.length+" frames"+(parse.limited?" shown (capped for speed)":"")+" | max tree: "+(filtered[best]?filtered[best].node_count:0)+" nodes - "+label;el("load-status").className=all.length?"ok":"err";renderAt(best)}function loadDefault(){fetch('../../shared/_captures/ebpf-cfs_tree-rbtree.ndjson').then(function(r){if(!r.ok)throw new Error(String(r.status));return r.text()}).then(function(t){loadData(t,'../shared/_captures/ebpf-cfs_tree-rbtree.ndjson')}).catch(function(){el('load-status').textContent='shared/_captures/ebpf-cfs_tree-rbtree.ndjson not found - use Load Log';el('load-status').className='err';renderAt(0)})}el('btn-load').addEventListener('click',function(){el('file-input').click()});el('file-input').addEventListener('change',function(){var file=this.files[0],reader;if(!file)return;reader=new FileReader();reader.onload=function(e){loadData(e.target.result,file.name)};reader.readAsText(file);this.value=''});el('btn-play').addEventListener('click',function(){if(filtered.length)setPlay(!playing)});el('btn-prev').addEventListener('click',function(){setPlay(false);renderAt(idx-1)});el('btn-next').addEventListener('click',function(){setPlay(false);renderAt(idx+1)});el('scrub').addEventListener('input',function(){setPlay(false);renderAt(parseInt(this.value,10))});el('speed-sel').addEventListener('change',function(){speed=parseInt(this.value,10)});el('filter-sel').addEventListener('change',function(){setPlay(false);applyFilter()});document.addEventListener('keydown',function(e){if(e.code==='Space'){e.preventDefault();el('btn-play').click()}if(e.code==='ArrowRight'){e.preventDefault();el('btn-next').click()}if(e.code==='ArrowLeft'){e.preventDefault();el('btn-prev').click()}});window.addEventListener('resize',function(){last={};if(filtered.length&&idx>=0)renderAt(idx)});loadDefault();})();
</script>
</body>
</html>
