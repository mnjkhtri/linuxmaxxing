<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module Study Viewer</title>
<link rel="stylesheet" href="../theme.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden;font-size:12px;background:var(--bg);color:var(--text);font-family:var(--sans)}#module-app{width:100vw;height:100vh;display:grid;grid-template-rows:auto minmax(0,1fr);gap:10px;padding:10px}#toolbar,#summary,.card,#details{border:1px solid var(--line);border-radius:16px;background:rgba(15,23,42,.78);box-shadow:var(--shadow);backdrop-filter:blur(18px)}#toolbar{display:flex;align-items:center;gap:8px;min-width:0;padding:10px}h1{font-family:var(--mono);font-size:13px;white-space:nowrap}h1 span{color:var(--purple)}button,input,select{height:30px;border:1px solid var(--line);border-radius:8px;background:var(--soft);color:var(--text);font-family:var(--mono);font-size:10px}button{padding:0 10px;cursor:pointer}button:hover,select:hover,input:hover{border-color:var(--blue)}input{width:min(280px,28vw);padding:0 9px}select{padding:0 8px}#status{margin-left:auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-family:var(--mono);font-size:10px}#main{min-height:0;display:grid;grid-template-columns:290px minmax(0,1fr) 390px;gap:10px}#summary,#content,#details{min-height:0;overflow:auto}#summary,#details{padding:12px}#content{display:grid;gap:10px;align-content:start}.section-title{margin-bottom:8px;font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}.stat{border:1px solid var(--line);border-radius:10px;background:var(--panel-2);padding:10px}.stat b{display:block;font-family:var(--mono);font-size:18px;line-height:1.15}.stat span{color:var(--muted);font-size:11px}.card{min-width:0;padding:14px;overflow:hidden}.card-header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}.card h2{font-size:13px}.card small{color:var(--muted);font-family:var(--mono)}.event{display:grid;grid-template-columns:92px 72px minmax(0,1fr);gap:8px;padding:8px;border:1px solid var(--line);border-radius:10px;background:rgba(2,6,23,.38);font-family:var(--mono);font-size:10px;cursor:pointer}.event+.event{margin-top:6px}.event:hover,.event.active{border-color:var(--blue);background:rgba(56,189,248,.09)}.event span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.event-type{color:var(--purple)}.event.mm .event-type{color:var(--orange)}.bar-row{display:grid;grid-template-columns:96px minmax(0,1fr) 46px;align-items:center;gap:8px;margin-bottom:7px;font-family:var(--mono);font-size:10px}.bar-row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar-track{height:10px;border-radius:999px;background:#0b1424;overflow:hidden}.bar-fill{height:100%;border-radius:999px;background:var(--purple)}.bar-fill.green{background:var(--green)}.bar-fill.orange{background:var(--orange)}.bar-fill.blue{background:var(--blue)}table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:10px}th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{color:var(--muted);font-weight:600}tr{cursor:pointer}tr:hover{background:var(--soft)}.table-wrap{overflow:auto}.region{display:grid;grid-template-columns:170px minmax(0,1fr);gap:10px;align-items:center;margin-bottom:9px;font-family:var(--mono);font-size:10px;cursor:pointer}.region b{display:block;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.region span{color:var(--muted)}.region-track{height:18px;border:1px solid var(--line);border-radius:999px;background:#0b1424;overflow:hidden}.region-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--purple),var(--blue))}.allocator-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}.alloc-card{border:1px solid var(--line);border-radius:12px;background:var(--panel-2);padding:10px;font-family:var(--mono);cursor:pointer;min-width:0}.alloc-card:hover{border-color:var(--blue);background:rgba(56,189,248,.08)}.alloc-card b{display:block;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.alloc-card small{display:block;margin-top:5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pill{display:inline-block;padding:2px 6px;border:1px solid var(--line);border-radius:999px;background:#0b1424;color:var(--muted);font-family:var(--mono);font-size:9px}.warn{color:var(--orange)}.detail-card{border:1px solid var(--line);border-radius:10px;background:var(--panel-2);padding:10px;margin-bottom:10px;font-family:var(--mono)}.field{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding:5px 0;font-size:10px}.field b{color:var(--muted);font-weight:500}.field span{overflow-wrap:anywhere;text-align:right}.raw{margin-top:10px;color:var(--muted);font-family:var(--mono);font-size:10px;white-space:pre-wrap;overflow-wrap:anywhere}.empty{margin:14px 0;color:var(--muted);font-family:var(--mono)}.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:1050px){body{overflow:auto}#module-app{height:auto;min-height:100vh}#main{grid-template-columns:1fr}.split{grid-template-columns:1fr}#toolbar{flex-wrap:wrap}#status{width:100%;margin-left:0}input{width:min(100%,320px)}}
</style>
</head>
<body>
<div id="module-app"><div id="toolbar"><h1><span>Module</span> Subsystem</h1><button id="load-core">Load Core</button><input id="core-input" type="file" accept=".txt,.log" hidden><button id="load-mm">Load MM</button><input id="mm-input" type="file" accept=".txt,.log" hidden><select id="view-select"><option value="overview">overview</option><option value="core">core tasks</option><option value="mm">mm allocators</option><option value="raw-mm">raw mm</option></select><input id="filter-input" type="search" placeholder="filter capture lines"><div id="status">Loading module captures...</div></div><div id="main"><aside id="summary"><div class="section-title">Summary</div><div class="stat-grid"><div class="stat"><b id="core-count">0</b><span>core lines</span></div><div class="stat"><b id="mm-count">0</b><span>MM lines</span></div><div class="stat"><b id="task-count">0</b><span>tasks</span></div></div><div class="section-title">Line Mix</div><div id="mix-bars"></div><div class="section-title">Allocator Sections</div><div id="type-bars"></div></aside><main id="content"><div class="empty">Loading module captures...</div></main><aside id="details"><div class="section-title">Details</div><div class="empty">Select a row, allocation, mapping, or region.</div></aside></div></div>
<script>
(function(){'use strict';var state={core:[],mm:[]};function el(id){return document.getElementById(id)}function esc(v){return String(v==null?'':v).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}function time(line){var m=line.match(/^\[\s*([^\]]+)\]/);return m?m[1].trim():'-'}function lineText(line,prefix){var at=line.indexOf(prefix);return at>=0?line.slice(at+prefix.length).trim():line}function parseLines(text,kind,prefix){return text.split('\n').filter(Boolean).map(function(line,i){return{kind:kind,line:i+1,time:time(line),text:lineText(line,prefix),raw:line}})}function coreTasks(){return state.core.map(function(ev){var m=ev.text.match(/^\s*([0-9]+)\s+([0-9]+)\s+(\S+)\s+(\S+)\s+\[?\s*([^\]]+?)\]?\s+(\S+)\s*$/);return m?{event:ev,tgid:m[1],pid:m[2],task_struct:m[3],kernel_stack:m[4],name:m[5].trim(),type:m[6]}:null}).filter(Boolean)}function filtered(items){var q=el('filter-input').value.trim().toLowerCase();return q?items.filter(function(ev){return(ev.raw||'').toLowerCase().indexOf(q)>=0}):items}function countBy(items,fn){var o={};items.forEach(function(x){var k=fn(x)||'unknown';o[k]=(o[k]||0)+1});return o}function top(o,n){return Object.keys(o).map(function(k){return{key:k,count:o[k]}}).sort(function(a,b){return b.count-a.count}).slice(0,n)}function bars(id,items,cls){var max=items.reduce(function(m,e){return Math.max(m,e.count)},1);el(id).innerHTML=items.map(function(e){return'<div class="bar-row"><span title="'+esc(e.key)+'">'+esc(e.key)+'</span><div class="bar-track"><div class="bar-fill '+(cls||'')+'" style="width:'+Math.max(3,e.count/max*100).toFixed(1)+'%"></div></div><b>'+e.count+'</b></div>'}).join('')||'<div class="empty">No data</div>'}function show(title,rows,raw){el('details').innerHTML='<div class="section-title">Details</div><div class="detail-card"><h2>'+esc(title)+'</h2>'+rows.map(function(r){return'<div class="field"><b>'+esc(r[0])+'</b><span>'+esc(r[1])+'</span></div>'}).join('')+(raw?'<div class="raw">'+esc(raw)+'</div>':'')+'</div>'}function kvRows(obj){return Object.keys(obj).sort().map(function(k){return[k,obj[k]]})}function parseMm(){var section='';var sections=[];var allocs=[];var maps=[];var regions=[];state.mm.forEach(function(ev){var t=ev.text;var m;if((m=t.match(/^----\s*(.*?)\s*----$/))){section=m[1];sections.push({name:section,event:ev});return}m=t.match(/^(.+?)\s+(0x[0-9a-fA-F]+)\s+-\s+(0x[0-9a-fA-F]+)\s+([0-9]+)\s+KiB/);if(m){regions.push({event:ev,name:m[1].trim(),start:m[2],end:m[3],kib:parseInt(m[4],10)});return}m=t.match(/^([a-zA-Z0-9_]+(?:\([^)]*\))?):\s+(.*)$/);if(m&&/(addr=|returned=|requested=|object\[|name=|struct_page=)/.test(m[2])){allocs.push({event:ev,section:section,api:m[1],fields:parsePairs(m[2])});return}m=t.match(/^([a-zA-Z0-9_]+)(?:\[([0-9]+)\])?:\s+(.*)$/);if(m&&/(kva=|pfn=|vmalloc=|page=)/.test(m[3])){maps.push({event:ev,section:section,name:m[1],index:m[2]||'',fields:parsePairs(m[3]),warning:/not contiguous/.test(t)});return}if(/PFNs are not contiguous/.test(t)){maps.push({event:ev,section:section,name:t.split(':')[0],index:'warn',fields:{warning:t},warning:true})}});return{sections:sections,allocs:allocs,maps:maps,regions:regions}}function parsePairs(s){var out={};s.split(/\s+/).forEach(function(part){var eq=part.indexOf('=');if(eq>0){out[part.slice(0,eq)]=part.slice(eq+1)}});return out}function lineCard(title,items){var rows=items.slice(0,260).map(function(ev){return'<div class="event '+ev.kind+'" data-kind="'+ev.kind+'" data-line="'+ev.line+'"><span class="event-type">'+esc(ev.kind)+'</span><span>'+esc(ev.time)+'</span><span>'+esc(ev.text)+'</span></div>'}).join('');return'<section class="card"><div class="card-header"><h2>'+esc(title)+'</h2><small>first 260 matching lines</small></div>'+(rows||'<div class="empty">No matching lines.</div>')+'</section>'}function bindLines(){Array.prototype.slice.call(document.querySelectorAll('.event[data-kind]')).forEach(function(node){node.addEventListener('click',function(){var kind=node.getAttribute('data-kind'),line=node.getAttribute('data-line'),ev=state[kind].filter(function(x){return String(x.line)===line})[0];if(ev)show(kind+' line '+line,[['time',ev.time],['line',ev.line],['text',ev.text]],ev.raw)})})}function renderTasks(tasks){var rows=tasks.slice(0,300).map(function(t){return'<tr data-kind="core" data-line="'+t.event.line+'"><td>'+esc(t.tgid)+'</td><td>'+esc(t.pid)+'</td><td>'+esc(t.name)+'</td><td>'+esc(t.type)+'</td><td>'+esc(t.task_struct)+'</td><td>'+esc(t.kernel_stack)+'</td></tr>'}).join('');return'<section class="card"><div class="card-header"><h2>Core Module Task Snapshot</h2><small>shared/_captures/core-module-tasks.txt</small></div><div class="table-wrap"><table><thead><tr><th>TGID</th><th>PID</th><th>thread</th><th>type</th><th>task_struct</th><th>kernel_stack</th></tr></thead><tbody>'+rows+'</tbody></table></div></section>'}function renderRegions(regions){var max=regions.reduce(function(m,r){return Math.max(m,r.kib)},1);return'<section class="card"><div class="card-header"><h2>Kernel VAS Layout</h2><small>ranges from module capture</small></div>'+regions.map(function(r,i){return'<div class="region" data-region="'+i+'"><div><b>'+esc(r.name)+'</b><span>'+esc(r.start+' - '+r.end)+'</span></div><div class="region-track"><div class="region-fill" style="width:'+Math.max(3,r.kib/max*100).toFixed(1)+'%"></div></div></div>'}).join('')+'</section>'}function renderAllocatorCards(mm){var cards=mm.allocs.map(function(a,i){var f=a.fields;var sub=f.requested?'requested '+f.requested:f.actual?'actual '+f.actual:f.object_size?'object '+f.object_size:f.addr||f.returned||'';return'<div class="alloc-card" data-alloc="'+i+'"><b>'+esc(a.api)+'</b><small>'+esc(a.section||'-')+'</small><small>'+esc(sub)+'</small></div>'}).join('');return'<section class="card"><div class="card-header"><h2>Allocator API Calls</h2><small>page, slab, custom slab, vmalloc</small></div><div class="allocator-grid">'+(cards||'<div class="empty">No allocator calls parsed.</div>')+'</div></section>'}function renderMappingTable(mm){var rows=mm.maps.map(function(m,i){var f=m.fields;return'<tr data-map="'+i+'"><td>'+esc(m.section)+'</td><td>'+esc(m.name+(m.index!==''?'['+m.index+']':''))+'</td><td>'+esc(f.kva||'-')+'</td><td>'+esc(f.pa||'-')+'</td><td>'+esc(f.pfn||'-')+'</td><td>'+esc(f.vmalloc||'')+(m.warning?' <span class="pill warn">warn</span>':'')+'</td></tr>'}).join('');return'<section class="card"><div class="card-header"><h2>Virtual To Physical Mapping</h2><small>PFN continuity and vmalloc backing pages</small></div><div class="table-wrap"><table><thead><tr><th>section</th><th>name</th><th>kva</th><th>pa</th><th>pfn</th><th>note</th></tr></thead><tbody>'+rows+'</tbody></table></div></section>'}function renderMmView(){var mm=parseMm();return renderRegions(mm.regions)+renderAllocatorCards(mm)+renderMappingTable(mm)}function bindMm(){var mm=parseMm();Array.prototype.slice.call(document.querySelectorAll('.region[data-region]')).forEach(function(node){node.addEventListener('click',function(){var r=mm.regions[parseInt(node.getAttribute('data-region'),10)];show(r.name,[['start',r.start],['end',r.end],['size',r.kib+' KiB'],['line',r.event.line]],r.event.raw)})});Array.prototype.slice.call(document.querySelectorAll('.alloc-card[data-alloc]')).forEach(function(node){node.addEventListener('click',function(){var a=mm.allocs[parseInt(node.getAttribute('data-alloc'),10)];show(a.api, [['section',a.section],['line',a.event.line]].concat(kvRows(a.fields)), a.event.raw)})});Array.prototype.slice.call(document.querySelectorAll('tr[data-map]')).forEach(function(node){node.addEventListener('click',function(){var m=mm.maps[parseInt(node.getAttribute('data-map'),10)];show(m.name, [['section',m.section],['index',m.index||'-'],['line',m.event.line]].concat(kvRows(m.fields)), m.event.raw)})})}function bindTables(tasks){Array.prototype.slice.call(document.querySelectorAll('tr[data-kind]')).forEach(function(row){row.addEventListener('click',function(){var ev=state.core.filter(function(x){return String(x.line)===row.getAttribute('data-line')})[0];if(ev)show('core task row',[['time',ev.time],['line',ev.line]],ev.raw)})})}function updateSummary(){var c=filtered(state.core),m=filtered(state.mm),tasks=coreTasks().filter(function(t){return filtered([t.event]).length}),mm=parseMm();el('core-count').textContent=c.length;el('mm-count').textContent=m.length;el('task-count').textContent=tasks.length;bars('mix-bars',top({core:c.length,mm:m.length},2),'green');bars('type-bars',top(countBy(mm.sections,function(s){return s.name}),8),'orange')}function render(){updateSummary();var view=el('view-select').value,tasks=coreTasks();if(view==='core'){el('content').innerHTML=renderTasks(tasks.filter(function(t){return filtered([t.event]).length}));bindTables(tasks);return}if(view==='mm'){el('content').innerHTML=renderMmView();bindMm();return}if(view==='raw-mm'){el('content').innerHTML=lineCard('Raw MM Lines',filtered(state.mm));bindLines();return}el('content').innerHTML='<div class="split">'+renderTasks(tasks.filter(function(t){return filtered([t.event]).length}))+renderMmView()+'</div>';bindLines();bindTables(tasks);bindMm()}function status(){el('status').textContent=state.core.length+' core, '+state.mm.length+' mm lines'}function loadKind(kind,text){var prefix=kind==='core'?'KOOPS_CORE':'KOOPS_MM';state[kind]=parseLines(text,kind,prefix);status();render()}function read(input,kind){var f=input.files[0],r;if(!f)return;r=new FileReader();r.onload=function(e){loadKind(kind,e.target.result)};r.readAsText(f);input.value=''}function fetchKind(kind,path){return fetch(path).then(function(r){if(!r.ok)throw new Error(String(r.status));return r.text()}).then(function(t){loadKind(kind,t)}).catch(function(){status();render()})}el('load-core').addEventListener('click',function(){el('core-input').click()});el('load-mm').addEventListener('click',function(){el('mm-input').click()});el('core-input').addEventListener('change',function(){read(this,'core')});el('mm-input').addEventListener('change',function(){read(this,'mm')});el('filter-input').addEventListener('input',render);el('view-select').addEventListener('change',render);Promise.allSettled([fetchKind('core','../../shared/_captures/core-module-tasks.txt'),fetchKind('mm','../../shared/_captures/mm-module-allocators.txt')]).then(function(){status();render()});})();
</script>
</body>
</html>
