<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Core Subsystem Viewer</title>
  <link rel="stylesheet" href="../theme.css">
  <style>
    html, body { width: 100%; height: 100%; overflow: hidden; font-size: 12px; }

    #kernel-app {
      width: 100vw;
      height: 100vh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 12px;
      padding: 12px;
    }

    #toolbar, #summary, .card, #details {
      border: 1px solid var(--line);
      border-radius: 20px;
      background: rgba(15, 23, 42, 0.78);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    #toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px;
      min-width: 0;
    }

    h1 { font-family: var(--mono); font-size: 13px; white-space: nowrap; }
    h1 span { color: var(--blue); }

    button, input, select {
      height: 30px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--soft);
      color: var(--text);
      font-family: var(--mono);
      font-size: 10px;
    }

    button { padding: 0 10px; cursor: pointer; }
    input { width: min(280px, 28vw); padding: 0 9px; }

    #status {
      margin-left: auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 10px;
    }

    #main {
      min-height: 0;
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr) 390px;
      gap: 10px;
    }

    #summary, #content, #details { min-height: 0; overflow: auto; }
    #summary, #details { padding: 12px; }
    #content { display: grid; grid-template-rows: 1fr 1fr; gap: 10px; }

    .section-title {
      margin-bottom: 8px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
    .stat { border: 1px solid var(--line); border-radius: 13px; background: var(--panel-2); padding: 10px; }
    .stat b { display: block; font-family: var(--mono); font-size: 18px; line-height: 1.15; }
    .stat span { color: var(--muted); font-size: 11px; }

    .card { min-width: 0; padding: 14px; overflow: auto; }
    .card-header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
    .card h2 { font-size: 13px; }
    .card small { color: var(--muted); font-family: var(--mono); }

    .event {
      display: grid;
      grid-template-columns: 72px 82px minmax(0, 1fr);
      gap: 8px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(2, 6, 23, 0.38);
      font-family: var(--mono);
      font-size: 10px;
      cursor: pointer;
    }

    .event + .event { margin-top: 6px; }
    .event:hover, .event.active { border-color: var(--blue); background: rgba(56, 189, 248, 0.09); }
    .event span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .event-type { color: var(--green); }
    .event.cfs .event-type { color: var(--orange); }
    .muted { color: var(--muted); }
    pre { white-space: pre-wrap; word-break: break-word; color: var(--text); font-family: var(--mono); font-size: 10px; }

    @media (max-width: 980px) {
      #kernel-app { height: auto; min-height: 100vh; overflow: auto; }
      body { overflow: auto; }
      #main { grid-template-columns: 1fr; }
      #content { grid-template-rows: none; }
      input { width: min(100%, 260px); }
    }
  </style>
</head>

<body>
  <div id="kernel-app">
    <header id="toolbar">
      <h1><span>Core</span> Subsystem</h1>
      <button id="reload">Reload</button>
      <input id="filter" type="search" placeholder="filter events">
      <div id="status">loading shared/core captures...</div>
    </header>

    <main id="main">
      <aside id="summary">
        <div class="section-title">Summary</div>
        <div class="stat-grid">
          <div class="stat"><b id="life-count">0</b><span>lifecycle events</span></div>
          <div class="stat"><b id="cfs-count">0</b><span>CFS events</span></div>
          <div class="stat"><b id="pid-count">0</b><span>PIDs</span></div>
          <div class="stat"><b id="event-count">0</b><span>total events</span></div>
        </div>
        <div class="section-title">Event Types</div>
        <div id="types"></div>
      </aside>

      <section id="content">
        <div class="card">
          <div class="card-header"><h2>Process Lifecycle</h2><small>shared/_captures/core-hook-lifecycle.txt</small></div>
          <div id="lifecycle-events"></div>
        </div>
        <div class="card">
          <div class="card-header"><h2>CFS Scheduler</h2><small>shared/_captures/core-hook-cfs-rbtree.txt</small></div>
          <div id="cfs-events"></div>
        </div>
      </section>

      <aside id="details">
        <div class="section-title">Details</div>
        <pre id="detail-text">Select an event.</pre>
      </aside>
    </main>
  </div>

  <script>
    (function () {
      'use strict';

      var MAX_CFS_EVENTS = 3000;
      var state = { lifecycle: [], cfs: [], selected: null };

      function el(id) { return document.getElementById(id); }

      function parseLine(line, subsystem) {
        var pid = (line.match(/\bpid=([0-9]+)/) || line.match(/\bPID=([0-9]+)/) || [])[1] || '-';
        var comm = (line.match(/\bcomm=([^\s]+)/) || line.match(/\btask=([^\s]+)/) || [])[1] || '-';
        var type = (line.match(/\b(LIFE|CFS)[:_ -]?([A-Z0-9_]+)/) || [])[2] || subsystem.toUpperCase();
        var time = (line.match(/^\[\s*([^\]]+)\]/) || [])[1] || '';
        return { subsystem: subsystem, type: type, pid: pid, comm: comm, time: time, raw: line };
      }

      function renderEvent(event) {
        var row = document.createElement('div');
        row.className = 'event ' + event.subsystem;
        row.innerHTML = '<span class="event-type">' + event.type + '</span><span>pid ' + event.pid + '</span><span>' + event.comm + '</span>';
        row.addEventListener('click', function () {
          state.selected = event;
          Array.prototype.forEach.call(document.querySelectorAll('.event'), function (item) { item.classList.remove('active'); });
          row.classList.add('active');
          el('detail-text').textContent = event.raw;
        });
        return row;
      }

      function renderList(id, events, query) {
        var list = el(id);
        list.textContent = '';
        events.filter(function (event) {
          return !query || event.raw.toLowerCase().indexOf(query) !== -1;
        }).slice(0, 400).forEach(function (event) {
          list.appendChild(renderEvent(event));
        });
      }

      function renderTypes(events) {
        var counts = {};
        events.forEach(function (event) { counts[event.type] = (counts[event.type] || 0) + 1; });
        el('types').innerHTML = Object.keys(counts).sort().map(function (type) {
          return '<div class="event"><span class="event-type">' + type + '</span><span>' + counts[type] + '</span><span class="muted">events</span></div>';
        }).join('') || '<div class="muted">No events loaded.</div>';
      }

      function render() {
        var query = el('filter').value.trim().toLowerCase();
        var all = state.lifecycle.concat(state.cfs);
        var pids = {};
        all.forEach(function (event) { if (event.pid !== '-') pids[event.pid] = true; });

        el('life-count').textContent = state.lifecycle.length;
        el('cfs-count').textContent = state.cfs.length;
        el('pid-count').textContent = Object.keys(pids).length;
        el('event-count').textContent = all.length;
        renderTypes(all);
        renderList('lifecycle-events', state.lifecycle, query);
        renderList('cfs-events', state.cfs, query);
      }

      function loadText(path) {
        return fetch(path).then(function (response) {
          if (!response.ok) throw new Error(path + ' not found');
          return response.text();
        });
      }

      function load() {
        el('status').textContent = 'loading shared/core captures...';
        Promise.allSettled([
          loadText('../../shared/_captures/core-hook-lifecycle.txt'),
          loadText('../../shared/_captures/core-hook-cfs-rbtree.txt')
        ]).then(function (results) {
          state.lifecycle = results[0].status === 'fulfilled' ? results[0].value.split('\n').filter(Boolean).map(function (line) { return parseLine(line, 'lifecycle'); }) : [];
          state.cfs = results[1].status === 'fulfilled' ? results[1].value.split('\n').filter(function (line) { return line.indexOf('CFS ') >= 0 && line.indexOf('rec=frame') >= 0; }).slice(0, MAX_CFS_EVENTS).map(function (line) { return parseLine(line, 'cfs'); }) : [];
          el('status').textContent = 'loaded ' + (state.lifecycle.length + state.cfs.length) + ' kernel events' + (state.cfs.length === MAX_CFS_EVENTS ? ' (CFS list capped)' : '');
          render();
        });
      }

      el('reload').addEventListener('click', load);
      el('filter').addEventListener('input', render);
      load();
    })();
  </script>
</body>

</html>
