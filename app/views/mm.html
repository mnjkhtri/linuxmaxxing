<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Study Viewer</title>
  <link rel="stylesheet" href="../theme.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #070a12;
      --panel: rgba(11, 18, 32, 0.82);
      --panel-2: rgba(20, 31, 52, 0.86);
      --line: rgba(148, 163, 184, 0.18);
      --text: #e8eef8;
      --muted: #91a3bb;
      --soft: rgba(30, 41, 59, 0.82);
      --alloc: #38bdf8;
      --free: #fb7185;
      --green: #34d399;
      --orange: #f59e0b;
      --purple: #a78bfa;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background:
        radial-gradient(circle at 10% -10%, rgba(56, 189, 248, 0.18) 0, transparent 34rem),
        radial-gradient(circle at 90% 4%, rgba(167, 139, 250, 0.16) 0, transparent 30rem),
        linear-gradient(135deg, #070a12, #0b1020);
      color: var(--text);
      font-family: var(--sans);
      font-size: 12px;
    }

    body { overflow: hidden; }

    #memory-app {
      width: 100vw;
      height: 100vh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 10px;
      padding: 10px;
    }

    #toolbar, #summary, .card, #details {
      border: 1px solid var(--line);
      border-radius: 20px;
      background: rgba(15, 23, 42, 0.78);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    #toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      padding: 10px;
    }

    h1 { font-family: var(--mono); font-size: 13px; white-space: nowrap; }
    h1 span { color: var(--alloc); }

    button, input, select {
      height: 30px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--soft);
      color: var(--text);
      font-family: var(--mono);
      font-size: 10px;
    }

    button { padding: 0 10px; cursor: pointer; }
    button:hover { border-color: #426283; }
    input { width: min(260px, 26vw); padding: 0 9px; }
    select { padding: 0 8px; }

    #status {
      margin-left: auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 10px;
    }

    #main {
      min-height: 0;
      display: grid;
      grid-template-columns: 290px minmax(0, 1fr) 370px;
      gap: 10px;
    }

    #summary, #content, #details {
      min-height: 0;
      overflow: auto;
    }

    #summary, #details { padding: 12px; }
    #content { display: grid; gap: 10px; align-content: start; }

    .section-title {
      margin-bottom: 8px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
    .stat { border: 1px solid var(--line); border-radius: 13px; background: var(--panel-2); padding: 10px; }
    .stat b { display: block; font-family: var(--mono); font-size: 18px; line-height: 1.15; }
    .stat span { color: var(--muted); font-size: 11px; }

    .bar-row {
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr) 48px;
      align-items: center;
      gap: 8px;
      margin-bottom: 7px;
      font-family: var(--mono);
      font-size: 10px;
    }

    .bar-row span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bar-track { height: 10px; border-radius: 999px; background: #0b1424; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 999px; background: var(--alloc); }
    .bar-fill.green { background: var(--green); }
    .bar-fill.orange { background: var(--orange); }
    .bar-fill.purple { background: var(--purple); }
    .bar-fill.free { background: var(--free); }

    .card { min-width: 0; padding: 16px; overflow: hidden; }
    .card-header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
    .card h2 { font-size: 13px; }
    .card small { color: var(--muted); font-family: var(--mono); }

    #pressure-chart {
      height: 260px;
      display: grid;
      grid-template-columns: repeat(96, minmax(3px, 1fr));
      align-items: stretch;
      gap: 2px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: linear-gradient(#1d2d46 1px, transparent 1px), #0b1424;
      background-size: 100% 52px;
    }

    .pressure-bin { position: relative; min-width: 3px; cursor: pointer; }
    .pressure-zero { position: absolute; left: 0; right: 0; top: calc(50% - 1px); height: 1px; background: rgba(145, 163, 187, 0.35); }
    .pressure-alloc, .pressure-free { position: absolute; left: 0; right: 0; border-radius: 5px; }
    .pressure-alloc { bottom: 50%; background: linear-gradient(to top, var(--alloc), #7dd3fc); }
    .pressure-free { top: 50%; background: linear-gradient(to bottom, var(--free), #fda4af); }

    .legend { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 10px; color: var(--muted); font-family: var(--mono); font-size: 10px; }
    .legend i { display: inline-block; width: 10px; height: 10px; margin-right: 5px; border-radius: 2px; vertical-align: -1px; }

    .split { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    #order-heatmap {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(76px, 1fr));
      gap: 8px;
    }

    .heat-cell {
      min-height: 70px;
      border: 1px solid var(--line);
      border-radius: 13px;
      padding: 9px;
      background: var(--soft);
      cursor: pointer;
    }

    .heat-cell b { display: block; font-family: var(--mono); font-size: 14px; }
    .heat-cell span { color: var(--muted); }

    #pfn-map {
      display: grid;
      grid-template-columns: repeat(48, minmax(4px, 1fr));
      gap: 3px;
    }

    .pfn-cell {
      aspect-ratio: 1;
      border-radius: 3px;
      background: #18263c;
      cursor: pointer;
    }

    .cache-table {
      width: 100%;
      border-collapse: collapse;
      font-family: var(--mono);
      font-size: 10px;
    }

    .cache-table th, .cache-table td {
      padding: 7px 6px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      white-space: nowrap;
    }

    .cache-table th { color: var(--muted); font-weight: 600; }
    .cache-table tr { cursor: pointer; }
    .cache-table tr:hover { background: var(--soft); }

    .cache-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; }
    .cache-card { border: 1px solid var(--line); border-radius: 14px; background: var(--soft); padding: 10px; cursor: pointer; }
    .cache-card:hover { border-color: #426283; }
    .cache-card b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); }
    .cache-card small { display: block; margin: 4px 0 8px; color: var(--muted); font-family: var(--mono); }
    .waste-track { height: 9px; overflow: hidden; border-radius: 999px; background: #0b1424; }
    .waste-fill { height: 100%; border-radius: 999px; background: linear-gradient(to right, var(--green), var(--orange), var(--free)); }

    .addr-map { display: grid; gap: 12px; }
    .addr-lane { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 12px; align-items: center; }
    .addr-label { min-width: 0; font-family: var(--mono); font-size: 10px; color: var(--muted); }
    .addr-label b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); font-size: 12px; }
    .addr-track { position: relative; height: 54px; border: 1px solid var(--line); border-radius: 14px; background: linear-gradient(90deg, rgba(145, 163, 184, 0.12) 1px, transparent 1px), rgba(2, 6, 23, 0.74); background-size: 10% 100%; overflow: hidden; }
    .addr-segment { position: absolute; top: 9px; height: 22px; min-width: 4px; border: 1px solid rgba(255, 255, 255, 0.16); border-radius: 8px; cursor: pointer; opacity: 0.94; box-shadow: 0 8px 18px rgba(0, 0, 0, 0.22); }
    .addr-segment.file { background: linear-gradient(90deg, var(--green), #86efac); }
    .addr-segment.anon { background: linear-gradient(90deg, var(--orange), #fbbf24); }
    .addr-segment.prot-none { top: 35px; height: 7px; background: var(--purple); }
    .addr-dot { position: absolute; top: 41px; width: 8px; height: 8px; border-radius: 999px; background: var(--alloc); border: 1px solid #0b1424; cursor: pointer; }
    .addr-dot.exit_mm { background: var(--free); }
    .addr-dot.copy_mm { background: var(--purple); }
    .addr-range { position: absolute; left: 10px; right: 10px; bottom: 5px; display: flex; justify-content: space-between; color: rgba(148, 163, 184, 0.78); font-family: var(--mono); font-size: 9px; pointer-events: none; }
    .addr-axis { display: flex; justify-content: space-between; margin-top: 10px; color: var(--muted); font-family: var(--mono); font-size: 10px; }

    .pill {
      display: inline-block;
      padding: 2px 6px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #0b1424;
      color: var(--muted);
    }

    .detail-card { border: 1px solid var(--line); border-radius: 13px; background: var(--panel-2); padding: 10px; margin-bottom: 10px; font-family: var(--mono); }
    .detail-card h2 { font-size: 12px; margin-bottom: 8px; overflow-wrap: anywhere; }
    .field { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px solid var(--line); padding: 5px 0; font-size: 10px; }
    .field b { color: var(--muted); font-weight: 500; }
    .field span { overflow-wrap: anywhere; text-align: right; }
    .empty { margin: 14px 0; color: var(--muted); font-family: var(--mono); }

    @media (max-width: 1120px) {
      body { overflow: auto; }
      #memory-app { height: auto; min-height: 100vh; }
      #main { grid-template-columns: 1fr; }
      #summary, #details { max-height: none; }
      input { width: 180px; }
    }

    @media (max-width: 720px) {
      #toolbar { flex-wrap: wrap; }
      #status { flex-basis: 100%; margin-left: 0; }
      input, select, button { flex: 1 1 auto; }
      .split { grid-template-columns: 1fr; }
      #pressure-chart { grid-template-columns: repeat(48, minmax(3px, 1fr)); height: 220px; }
    }
  </style>
</head>

<body>
  <div id="memory-app">
    <div id="toolbar">
      <h1><span>Memory</span> Study</h1>
      <button id="load-alloc-button">Load Alloc</button>
      <input id="alloc-file-input" type="file" accept=".txt" hidden>
      <button id="load-slab-button">Load Slab</button>
      <input id="slab-file-input" type="file" accept=".txt" hidden>
      <button id="load-addr-button">Load Address</button>
      <input id="addr-file-input" type="file" accept=".txt" hidden>
      <input id="filter-input" type="search" placeholder="filter task, cache, zone, pfn, file">
      <select id="view-select">
        <option value="overview">overview</option>
        <option value="alloc">allocator events</option>
        <option value="slab">slab caches</option>
        <option value="addr">address spaces</option>
      </select>
      <div id="status">No data loaded</div>
    </div>

    <div id="main">
      <aside id="summary">
        <div class="section-title">Summary</div>
        <div class="stat-grid">
          <div class="stat"><b id="alloc-count">0</b><span>allocator events</span></div>
          <div class="stat"><b id="slab-count">0</b><span>slab events</span></div>
          <div class="stat"><b id="addr-count">0</b><span>address events</span></div>
          <div class="stat"><b id="cache-count">0</b><span>cache objects</span></div>
        </div>
        <div class="section-title">Tasks By Net Pages</div>
        <div id="task-bars"></div>
        <div class="section-title">Zones</div>
        <div id="zone-bars"></div>
        <div class="section-title">Event Mix</div>
        <div id="event-bars"></div>
      </aside>
      <main id="content"><div class="empty">Loading memory captures...</div></main>
      <aside id="details"><div class="section-title">Details</div><div class="empty">Select a time bin, PFN cell, order, event, or cache.</div></aside>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      var allocEvents = [];
      var slabEvents = [];
      var addrEvents = [];

      function el(id) { return document.getElementById(id); }
      function escapeHtml(value) {
        return String(value == null ? '' : value).replace(/[&<>\"]/g, function (ch) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;' }[ch];
        });
      }
      function timestamp(line) {
        var left = line.indexOf('[');
        var right = line.indexOf(']');
        return left >= 0 && right > left ? line.slice(left + 1, right).trim() : '-';
      }
      function fields(text) {
        var out = {};
        text.trim().split(/\s+/).forEach(function (part) {
          var eq = part.indexOf('=');
          if (eq > 0) out[part.slice(0, eq)] = part.slice(eq + 1);
        });
        return out;
      }
      function parseCapture(text, prefix) {
        var events = [];
        text.split('\n').forEach(function (line, index) {
          var at = line.indexOf(prefix + ' ');
          if (at < 0) return;
          var kv = fields(line.slice(at + prefix.length + 1));
          var time = timestamp(line);
          events.push({
            id: prefix + ':' + events.length,
            line: index + 1,
            raw: line,
            prefix: prefix,
            time: time,
            timeNumber: parseFloat(time),
            event: kv.event || 'unknown',
            fields: kv
          });
        });
        return events;
      }
      function numberValue(value) {
        var parsed = parseInt(value || '0', 10);
        return isFinite(parsed) ? parsed : 0;
      }
      function hexValue(value) {
        if (!value) return NaN;
        var parsed = parseInt(String(value).replace(/^0x/, ''), 16);
        return isFinite(parsed) ? parsed : NaN;
      }
      function pageDelta(event) {
        var pages = Math.max(1, numberValue(event.fields.nr_pages));
        return event.event.indexOf('free') >= 0 ? -pages : pages;
      }
      function prettyNumber(value) {
        return Number(value || 0).toLocaleString();
      }
      function filteredAllocEvents() {
        var q = el('filter-input').value.trim().toLowerCase();
        if (!q) return allocEvents;
        return allocEvents.filter(function (event) { return event.raw.toLowerCase().indexOf(q) >= 0; });
      }
      function filteredSlabEvents() {
        var q = el('filter-input').value.trim().toLowerCase();
        if (!q) return slabEvents;
        return slabEvents.filter(function (event) { return event.raw.toLowerCase().indexOf(q) >= 0; });
      }
      function filteredAddrEvents() {
        var q = el('filter-input').value.trim().toLowerCase();
        if (!q) return addrEvents;
        return addrEvents.filter(function (event) { return event.raw.toLowerCase().indexOf(q) >= 0; });
      }
      function countBy(events, keyFn, valueFn) {
        var counts = {};
        events.forEach(function (event) {
          var key = keyFn(event) || 'unknown';
          counts[key] = (counts[key] || 0) + (valueFn ? valueFn(event) : 1);
        });
        return counts;
      }
      function topEntries(counts, limit, absolute) {
        return Object.keys(counts).map(function (key) { return { key: key, count: counts[key] }; })
          .sort(function (a, b) { return (absolute ? Math.abs(b.count) - Math.abs(a.count) : b.count - a.count); })
          .slice(0, limit);
      }
      function renderBars(id, entries, colorClass, absolute) {
        var max = entries.reduce(function (peak, entry) { return Math.max(peak, Math.abs(entry.count)); }, 1);
        el(id).innerHTML = entries.map(function (entry) {
          var pct = Math.max(2, (Math.abs(entry.count) / max) * 100);
          var cls = colorClass || (entry.count < 0 ? 'free' : '');
          return '<div class="bar-row"><span title="' + escapeHtml(entry.key) + '">' + escapeHtml(entry.key) + '</span><div class="bar-track"><div class="bar-fill ' + cls + '" style="width:' + pct.toFixed(1) + '%"></div></div><b>' + prettyNumber(absolute ? Math.abs(entry.count) : entry.count) + '</b></div>';
        }).join('') || '<div class="empty">No data</div>';
      }
      function showDetails(title, rows) {
        var fields = rows.map(function (row) {
          return '<div class="field"><b>' + escapeHtml(row[0]) + '</b><span>' + escapeHtml(row[1]) + '</span></div>';
        }).join('');
        el('details').innerHTML = '<div class="section-title">Details</div><div class="detail-card"><h2>' + escapeHtml(title) + '</h2>' + fields + '</div>';
      }
      function showEvent(event) {
        var rows = [['time', event.time], ['line', event.line], ['raw', event.raw]];
        Object.keys(event.fields).sort().forEach(function (key) { rows.push([key, event.fields[key]]); });
        showDetails(event.prefix + ' ' + event.event, rows);
      }
      function updateSummary() {
        var alloc = filteredAllocEvents();
        var slab = filteredSlabEvents();
        var addr = filteredAddrEvents();
        var netPages = alloc.reduce(function (sum, event) { return sum + pageDelta(event); }, 0);
        var caches = countBy(slab, function (event) { return event.fields.cache || event.fields.name; });
        el('alloc-count').textContent = prettyNumber(alloc.length);
        el('slab-count').textContent = prettyNumber(slab.length);
        el('addr-count').textContent = prettyNumber(addr.length);
        el('cache-count').textContent = prettyNumber(Object.keys(caches).length);
        renderBars('task-bars', topEntries(countBy(alloc, function (event) { return event.fields.task; }, pageDelta), 8, true), '', false);
        renderBars('zone-bars', topEntries(countBy(alloc, function (event) { return event.fields.zone; }, function (event) { return Math.abs(pageDelta(event)); }), 6), 'green', true);
        renderBars('event-bars', topEntries(countBy(alloc.concat(addr), function (event) { return event.event; }), 8), 'purple', true);
      }
      function timeBins(events, count) {
        var times = events.map(function (event) { return event.timeNumber; }).filter(function (time) { return isFinite(time); });
        var min = times.length ? Math.min.apply(null, times) : 0;
        var max = times.length ? Math.max.apply(null, times) : min + 1;
        var span = Math.max(0.001, max - min);
        var bins = [];
        for (var i = 0; i < count; i += 1) bins.push({ alloc: 0, free: 0, events: [], start: min + (span * i / count), end: min + (span * (i + 1) / count) });
        events.forEach(function (event) {
          var idx = isFinite(event.timeNumber) ? Math.min(count - 1, Math.floor(((event.timeNumber - min) / span) * count)) : 0;
          var delta = pageDelta(event);
          bins[idx].events.push(event);
          if (delta < 0) bins[idx].free += Math.abs(delta);
          else bins[idx].alloc += delta;
        });
        return bins;
      }
      function renderPressureCard(events) {
        var bins = timeBins(events, 96);
        var peak = bins.reduce(function (max, bin) { return Math.max(max, bin.alloc, bin.free); }, 1);
        var chart = bins.map(function (bin, index) {
          var allocHeight = (bin.alloc / peak) * 49;
          var freeHeight = (bin.free / peak) * 49;
          return '<div class="pressure-bin" data-bin="' + index + '" title="' + bin.start.toFixed(3) + '-' + bin.end.toFixed(3) + 's alloc=' + bin.alloc + ' free=' + bin.free + '"><div class="pressure-zero"></div><div class="pressure-alloc" style="height:' + allocHeight.toFixed(1) + '%"></div><div class="pressure-free" style="height:' + freeHeight.toFixed(1) + '%"></div></div>';
        }).join('');
        return '<section class="card"><div class="card-header"><h2>Allocator Pressure</h2><small>allocs above center, frees below</small></div><div id="pressure-chart">' + chart + '</div><div class="legend"><span><i style="background:var(--alloc)"></i>allocated pages</span><span><i style="background:var(--free)"></i>freed pages</span><span>peak bin ' + prettyNumber(peak) + ' pages</span></div></section>';
      }
      function bindPressure(events) {
        var bins = timeBins(events, 96);
        Array.prototype.slice.call(el('content').querySelectorAll('.pressure-bin')).forEach(function (node) {
          node.addEventListener('click', function () {
            var bin = bins[numberValue(node.getAttribute('data-bin'))];
            showDetails('time bin ' + bin.start.toFixed(6) + '-' + bin.end.toFixed(6) + 's', [
              ['events', bin.events.length], ['allocated pages', bin.alloc], ['freed pages', bin.free], ['net pages', bin.alloc - bin.free], ['top task', topEntries(countBy(bin.events, function (event) { return event.fields.task; }), 1)[0]?.key || '-']
            ]);
          });
        });
      }
      function renderOrderHeatmap(events) {
        var counts = countBy(events, function (event) { return event.fields.order || '0'; }, function (event) { return Math.abs(pageDelta(event)); });
        var max = Object.keys(counts).reduce(function (peak, key) { return Math.max(peak, counts[key]); }, 1);
        var cells = Object.keys(counts).sort(function (a, b) { return numberValue(a) - numberValue(b); }).map(function (order) {
          var pct = counts[order] / max;
          var bg = 'rgba(56, 189, 248, ' + (0.12 + pct * 0.72).toFixed(2) + ')';
          return '<div class="heat-cell" data-order="' + escapeHtml(order) + '" style="background:' + bg + '"><b>order ' + escapeHtml(order) + '</b><span>' + prettyNumber(counts[order]) + ' pages</span></div>';
        }).join('');
        return '<section class="card"><div class="card-header"><h2>Order Heatmap</h2><small>higher order means larger contiguous blocks</small></div><div id="order-heatmap">' + cells + '</div></section>';
      }
      function bindOrders(events) {
        Array.prototype.slice.call(el('content').querySelectorAll('.heat-cell')).forEach(function (node) {
          node.addEventListener('click', function () {
            var order = node.getAttribute('data-order');
            var matches = events.filter(function (event) { return (event.fields.order || '0') === order; });
            showDetails('order ' + order, [['events', matches.length], ['pages touched', matches.reduce(function (sum, event) { return sum + Math.abs(pageDelta(event)); }, 0)], ['top task', topEntries(countBy(matches, function (event) { return event.fields.task; }), 1)[0]?.key || '-']]);
          });
        });
      }
      function renderPfnMap(events) {
        var withPfn = events.map(function (event) { return { event: event, pfn: hexValue(event.fields.pfn) }; }).filter(function (item) { return isFinite(item.pfn); });
        if (!withPfn.length) return '<section class="card"><div class="empty">No PFN data.</div></section>';
        var min = withPfn.reduce(function (low, item) { return Math.min(low, item.pfn); }, withPfn[0].pfn);
        var max = withPfn.reduce(function (high, item) { return Math.max(high, item.pfn); }, withPfn[0].pfn);
        var span = Math.max(1, max - min);
        var buckets = [];
        for (var i = 0; i < 192; i += 1) buckets.push({ alloc: 0, free: 0, events: [] });
        withPfn.forEach(function (item) {
          var idx = Math.min(191, Math.floor(((item.pfn - min) / span) * 192));
          buckets[idx].events.push(item.event);
          if (pageDelta(item.event) < 0) buckets[idx].free += Math.abs(pageDelta(item.event));
          else buckets[idx].alloc += pageDelta(item.event);
        });
        var peak = buckets.reduce(function (value, bucket) { return Math.max(value, bucket.alloc + bucket.free); }, 1);
        var cells = buckets.map(function (bucket, index) {
          var pressure = (bucket.alloc + bucket.free) / peak;
          var red = bucket.free > bucket.alloc;
          var color = red ? 'rgba(251, 113, 133, ' : 'rgba(56, 189, 248, ';
          return '<div class="pfn-cell" data-pfn-bin="' + index + '" style="background:' + color + (0.08 + pressure * 0.82).toFixed(2) + ')"></div>';
        }).join('');
        return '<section class="card"><div class="card-header"><h2>PFN Locality Map</h2><small>low to high PFN, color by alloc/free pressure</small></div><div id="pfn-map">' + cells + '</div><div class="legend"><span>range 0x' + Math.round(min).toString(16) + ' - 0x' + Math.round(max).toString(16) + '</span></div></section>';
      }
      function bindPfn(events) {
        var withPfn = events.map(function (event) { return { event: event, pfn: hexValue(event.fields.pfn) }; }).filter(function (item) { return isFinite(item.pfn); });
        if (!withPfn.length) return;
        var min = withPfn.reduce(function (low, item) { return Math.min(low, item.pfn); }, withPfn[0].pfn);
        var max = withPfn.reduce(function (high, item) { return Math.max(high, item.pfn); }, withPfn[0].pfn);
        var span = Math.max(1, max - min);
        Array.prototype.slice.call(el('content').querySelectorAll('.pfn-cell')).forEach(function (node) {
          node.addEventListener('click', function () {
            var index = numberValue(node.getAttribute('data-pfn-bin'));
            var start = min + (span * index / 192);
            var end = min + (span * (index + 1) / 192);
            var matches = withPfn.filter(function (item) { return item.pfn >= start && item.pfn <= end; }).map(function (item) { return item.event; });
            showDetails('PFN bucket 0x' + Math.round(start).toString(16), [['range', '0x' + Math.round(start).toString(16) + ' - 0x' + Math.round(end).toString(16)], ['events', matches.length], ['allocated pages', matches.reduce(function (sum, event) { return sum + Math.max(0, pageDelta(event)); }, 0)], ['freed pages', matches.reduce(function (sum, event) { return sum + Math.max(0, -pageDelta(event)); }, 0)]]);
          });
        });
      }
      function slabWaste(event) {
        var objectSize = numberValue(event.fields.object_size);
        var size = numberValue(event.fields.size);
        return size > 0 ? Math.max(0, size - objectSize) / size : 0;
      }
      function renderSlabCards(events) {
        var top = events.slice().sort(function (a, b) { return numberValue(b.fields.size) - numberValue(a.fields.size); }).slice(0, 24);
        var cards = top.map(function (event) {
          var f = event.fields;
          var waste = slabWaste(event) * 100;
          var alias = f.cache_name && f.name && f.cache_name !== f.name ? ' via ' + f.cache_name : '';
          return '<div class="cache-card" data-id="' + event.id + '"><b title="' + escapeHtml(f.name || '-') + '">' + escapeHtml(f.name || '-') + '</b><small>' + escapeHtml((f.size || '-') + ' bytes' + alias) + '</small><div class="waste-track"><div class="waste-fill" style="width:' + waste.toFixed(1) + '%"></div></div><small>' + waste.toFixed(1) + '% internal waste</small></div>';
        }).join('');
        return '<section class="card"><div class="card-header"><h2>Largest Slab Caches</h2><small>bar shows object padding / internal waste</small></div><div class="cache-grid">' + cards + '</div></section>';
      }
      function renderAllocTable(events) {
        var rows = events.slice(0, 350).map(function (event) {
          var f = event.fields;
          var delta = pageDelta(event);
          return '<tr data-id="' + event.id + '"><td>' + escapeHtml(event.time) + '</td><td>' + escapeHtml(event.event) + '</td><td>' + escapeHtml(f.task || '-') + '</td><td>' + escapeHtml(f.order || '-') + '</td><td>' + escapeHtml(delta) + '</td><td>' + escapeHtml(f.zone || '-') + '</td><td>' + escapeHtml(f.pfn || '-') + '</td></tr>';
        }).join('');
        return '<section class="card"><div class="card-header"><h2>Allocator Events</h2><small>first 350 matching rows</small></div><table class="cache-table"><thead><tr><th>time</th><th>event</th><th>task</th><th>order</th><th>delta</th><th>zone</th><th>pfn</th></tr></thead><tbody>' + rows + '</tbody></table></section>';
      }
      function renderSlabTable(events) {
        var rows = events.map(function (event) {
          var f = event.fields;
          var alias = f.cache_name && f.name && f.cache_name !== f.name ? '<span class="pill">alias</span>' : '';
          return '<tr data-id="' + event.id + '"><td>' + escapeHtml(event.time) + '</td><td>' + escapeHtml(f.name || '-') + '</td><td>' + escapeHtml(f.cache_name || '-') + ' ' + alias + '</td><td>' + escapeHtml(f.object_size || '-') + '</td><td>' + escapeHtml(f.size || '-') + '</td><td>' + (slabWaste(event) * 100).toFixed(1) + '%</td><td>' + escapeHtml(f.refcount || '-') + '</td></tr>';
        }).join('');
        return '<section class="card"><div class="card-header"><h2>Slab Cache Lifecycle</h2><small>requested cache vs actual backing cache</small></div><table class="cache-table"><thead><tr><th>time</th><th>requested</th><th>actual cache</th><th>object</th><th>size</th><th>waste</th><th>ref</th></tr></thead><tbody>' + rows + '</tbody></table></section>';
      }
      function mappingBytes(event) {
        return event.event === 'mmap' ? numberValue(event.fields.len) : 0;
      }
      function eventMmKeys(event) {
        var keys = [];
        if (event.fields.mm) keys.push(event.fields.mm);
        if (event.fields.oldmm) keys.push(event.fields.oldmm);
        if (event.fields.newmm && keys.indexOf(event.fields.newmm) < 0) keys.push(event.fields.newmm);
        return keys;
      }
      function primaryMm(event) {
        return event.fields.mm || event.fields.newmm || event.fields.oldmm || '-';
      }
      function eventsForMm(events, mm) {
        return events.filter(function (event) { return eventMmKeys(event).indexOf(mm) >= 0; });
      }
      function renderAddressCards(events) {
        var mmCountsMap = {};
        events.forEach(function (event) { eventMmKeys(event).forEach(function (mm) { mmCountsMap[mm] = (mmCountsMap[mm] || 0) + 1; }); });
        var mmCounts = topEntries(mmCountsMap, 18);
        var max = mmCounts.reduce(function (peak, entry) { return Math.max(peak, entry.count); }, 1);
        var cards = mmCounts.map(function (entry) {
          var matches = eventsForMm(events, entry.key);
          var task = (matches[0] && matches[0].fields.task) || '-';
          var mapped = matches.reduce(function (sum, event) { return sum + mappingBytes(event); }, 0);
          var pct = Math.max(3, entry.count / max * 100);
          return '<div class="cache-card" data-mm="' + escapeHtml(entry.key) + '"><b title="' + escapeHtml(entry.key) + '">' + escapeHtml(task) + '</b><small>' + escapeHtml(entry.key) + '</small><div class="waste-track"><div class="bar-fill purple" style="width:' + pct.toFixed(1) + '%"></div></div><small>' + prettyNumber(entry.count) + ' events, ' + prettyNumber(mapped) + ' mapped bytes</small></div>';
        }).join('');
        return '<section class="card"><div class="card-header"><h2>Address Space Lifecycles</h2><small>grouped by mm pointer, bar shows event volume</small></div><div class="cache-grid">' + cards + '</div></section>';
      }
      function addrValue(value) {
        if (!value) return NaN;
        var parsed = parseInt(String(value).replace(/^0x/, ''), 16);
        return isFinite(parsed) ? parsed : NaN;
      }
      function topAddressSpaces(events, limit) {
        var mmCountsMap = {};
        events.forEach(function (event) { eventMmKeys(event).forEach(function (mm) { mmCountsMap[mm] = (mmCountsMap[mm] || 0) + 1; }); });
        return topEntries(mmCountsMap, limit)
          .map(function (entry) { return { mm: entry.key, events: eventsForMm(events, entry.key) }; });
      }
      function renderAddressMap(events) {
        var maps = events.filter(function (event) { return event.event === 'mmap' && isFinite(addrValue(event.fields.returned_addr)); });
        if (!maps.length) return '<section class="card"><div class="empty">No mmap address ranges to draw.</div></section>';
        var ranges = maps.map(function (event) { return { start: addrValue(event.fields.returned_addr), end: addrValue(event.fields.returned_addr) + Math.max(1, mappingBytes(event)), event: event }; });
        var times = events.map(function (item) { return item.timeNumber; }).filter(function (time) { return isFinite(time); });
        var tmin = times.length ? Math.min.apply(null, times) : 0;
        var tmax = times.length ? Math.max.apply(null, times) : tmin + 1;
        var tspan = Math.max(0.001, tmax - tmin);
        var lanes = topAddressSpaces(events, 10).map(function (space) {
          var laneMaps = ranges.filter(function (item) { return eventMmKeys(item.event).indexOf(space.mm) >= 0; });
          if (!laneMaps.length) return '';
          var first = space.events[0] || { fields: {} };
          var min = laneMaps.reduce(function (low, item) { return Math.min(low, item.start); }, laneMaps[0].start);
          var max = laneMaps.reduce(function (high, item) { return Math.max(high, item.end); }, laneMaps[0].end);
          var span = Math.max(1, max - min);
          var mapped = laneMaps.reduce(function (sum, item) { return sum + Math.max(0, item.end - item.start); }, 0);
          var segments = laneMaps.map(function (item) {
            var event = item.event;
            var left = (item.start - min) / span * 100;
            var width = Math.max(0.35, (item.end - item.start) / span * 100);
            var cls = event.fields.prot === '0x0' ? 'prot-none' : event.fields.anonymous === '1' ? 'anon' : 'file';
            return '<div class="addr-segment ' + cls + '" data-id="' + event.id + '" style="left:' + left.toFixed(3) + '%;width:' + width.toFixed(3) + '%" title="' + escapeHtml((event.fields.file_name || 'anon') + ' ' + event.fields.returned_addr + ' +' + event.fields.len) + '"></div>';
          }).join('');
          var dots = space.events.filter(function (event) { return event.event !== 'mmap' && isFinite(event.timeNumber); }).map(function (event) {
            var left = (event.timeNumber - tmin) / tspan * 100;
            return '<div class="addr-dot ' + escapeHtml(event.event) + '" data-id="' + event.id + '" style="left:' + left.toFixed(3) + '%" title="' + escapeHtml(event.event + ' at ' + event.time) + '"></div>';
          }).join('');
          return '<div class="addr-lane"><div class="addr-label"><b>' + escapeHtml(first.fields.task || '-') + '</b><span>' + escapeHtml(space.mm) + '</span><span>' + prettyNumber(mapped) + ' bytes mapped</span></div><div class="addr-track">' + segments + dots + '<div class="addr-range"><span>0x' + Math.round(min).toString(16) + '</span><span>0x' + Math.round(max).toString(16) + '</span></div></div></div>';
        }).join('');
        return '<section class="card"><div class="card-header"><h2>Virtual Address Map</h2><small>each lane uses its own virtual-address scale; lifecycle dots use global time</small></div><div class="addr-map">' + lanes + '</div><div class="addr-axis"><span><i style="display:inline-block;width:10px;height:10px;background:var(--green)"></i> file-backed</span><span><i style="display:inline-block;width:10px;height:10px;background:var(--orange)"></i> anonymous</span><span><i style="display:inline-block;width:10px;height:10px;background:var(--purple)"></i> PROT_NONE / copy_mm</span><span><i style="display:inline-block;width:10px;height:10px;background:var(--red)"></i> exit_mm</span></div></section>';
      }
      function renderMappingMix(events) {
        var maps = events.filter(function (event) { return event.event === 'mmap'; });
        var anon = maps.filter(function (event) { return event.fields.anonymous === '1'; }).reduce(function (sum, event) { return sum + mappingBytes(event); }, 0);
        var file = maps.filter(function (event) { return event.fields.file_backed === '1'; }).reduce(function (sum, event) { return sum + mappingBytes(event); }, 0);
        var total = Math.max(1, anon + file);
        var anonPct = anon / total * 100;
        var filePct = file / total * 100;
        return '<section class="card"><div class="card-header"><h2>Mapping Mix</h2><small>mmap length split by backing type</small></div><div class="cache-grid"><div class="cache-card"><b>anonymous</b><small>' + prettyNumber(anon) + ' bytes</small><div class="waste-track"><div class="bar-fill orange" style="width:' + anonPct.toFixed(1) + '%"></div></div></div><div class="cache-card"><b>file-backed</b><small>' + prettyNumber(file) + ' bytes</small><div class="waste-track"><div class="bar-fill green" style="width:' + filePct.toFixed(1) + '%"></div></div></div></div></section>';
      }
      function renderAddressTable(events) {
        var rows = events.slice(0, 500).map(function (event) {
          var f = event.fields;
          return '<tr data-id="' + event.id + '"><td>' + escapeHtml(event.time) + '</td><td>' + escapeHtml(event.event) + '</td><td>' + escapeHtml(f.task || f.parent_task || '-') + '</td><td>' + escapeHtml(f.pid || f.child_pid || '-') + '</td><td>' + escapeHtml(primaryMm(event)) + '</td><td>' + escapeHtml(f.returned_addr || '-') + '</td><td>' + escapeHtml(f.len || '-') + '</td><td>' + escapeHtml(f.file_name || '-') + '</td></tr>';
        }).join('');
        return '<section class="card"><div class="card-header"><h2>Address Events</h2><small>mm_alloc, mmap, copy_mm, exit_mm; first 500 matching rows</small></div><table class="cache-table"><thead><tr><th>time</th><th>event</th><th>task</th><th>pid</th><th>mm</th><th>addr</th><th>len</th><th>file</th></tr></thead><tbody>' + rows + '</tbody></table></section>';
      }
      function bindAddressCards(events) {
        Array.prototype.slice.call(el('content').querySelectorAll('.cache-card[data-mm]')).forEach(function (node) {
          node.addEventListener('click', function () {
            var mm = node.getAttribute('data-mm');
            var matches = eventsForMm(events, mm);
            showDetails('mm ' + mm, [
              ['events', matches.length],
              ['tasks', Object.keys(countBy(matches, function (event) { return event.fields.task; })).join(', ') || '-'],
              ['mmap events', matches.filter(function (event) { return event.event === 'mmap'; }).length],
              ['mapped bytes', matches.reduce(function (sum, event) { return sum + mappingBytes(event); }, 0)],
              ['last event', (matches[matches.length - 1] || {}).event || '-']
            ]);
          });
        });
        Array.prototype.slice.call(el('content').querySelectorAll('.addr-segment[data-id], .addr-dot[data-id]')).forEach(function (node) {
          node.addEventListener('click', function () {
            var id = node.getAttribute('data-id');
            var event = events.filter(function (item) { return item.id === id; })[0];
            if (event) showEvent(event);
          });
        });
      }
      function bindEventRows(events) {
        Array.prototype.slice.call(el('content').querySelectorAll('tr[data-id], .cache-card[data-id]')).forEach(function (node) {
          node.addEventListener('click', function () {
            var id = node.getAttribute('data-id');
            var event = events.filter(function (item) { return item.id === id; })[0];
            if (event) showEvent(event);
          });
        });
      }
      function renderOverview() {
        var alloc = filteredAllocEvents();
        var slab = filteredSlabEvents();
        var addr = filteredAddrEvents();
        updateSummary();
        if (!alloc.length && !slab.length && !addr.length) {
          el('content').innerHTML = '<div class="card"><div class="empty">No memory events match the current filter.</div></div>';
          return;
        }
        el('content').innerHTML = renderPressureCard(alloc) + '<div class="split">' + renderOrderHeatmap(alloc) + renderPfnMap(alloc) + '</div>' + renderAddressMap(addr) + renderMappingMix(addr) + renderSlabCards(slab);
        bindPressure(alloc);
        bindOrders(alloc);
        bindPfn(alloc);
        bindAddressCards(addr);
        bindEventRows(slab);
      }
      function renderAllocView() {
        var events = filteredAllocEvents();
        updateSummary();
        el('content').innerHTML = events.length ? renderPressureCard(events) + renderAllocTable(events) : '<div class="card"><div class="empty">No allocator events match the current filter.</div></div>';
        bindPressure(events);
        bindEventRows(events);
      }
      function renderSlabView() {
        var events = filteredSlabEvents();
        updateSummary();
        el('content').innerHTML = events.length ? renderSlabCards(events) + renderSlabTable(events) : '<div class="card"><div class="empty">No slab events match the current filter.</div></div>';
        bindEventRows(events);
      }
      function renderAddrView() {
        var events = filteredAddrEvents();
        updateSummary();
        el('content').innerHTML = events.length ? renderAddressMap(events) + renderMappingMix(events) + renderAddressCards(events) + renderAddressTable(events) : '<div class="card"><div class="empty">No address-space events match the current filter.</div></div>';
        bindAddressCards(events);
        bindEventRows(events);
      }
      function render() {
        if (el('view-select').value === 'alloc') renderAllocView();
        else if (el('view-select').value === 'slab') renderSlabView();
        else if (el('view-select').value === 'addr') renderAddrView();
        else renderOverview();
      }
      function setStatus() {
        el('status').textContent = prettyNumber(allocEvents.length) + ' allocator, ' + prettyNumber(slabEvents.length) + ' slab, ' + prettyNumber(addrEvents.length) + ' address events';
      }
      function loadAlloc(text) {
        allocEvents = parseCapture(text, 'ALLOC');
        setStatus();
        render();
      }
      function loadSlab(text) {
        slabEvents = parseCapture(text, 'SLAB');
        setStatus();
        render();
      }
      function loadAddr(text) {
        addrEvents = parseCapture(text, 'ADDR');
        setStatus();
        render();
      }
      function readFile(input, callback) {
        var file = input.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function (event) { callback(event.target.result); };
        reader.readAsText(file);
        input.value = '';
      }
      el('load-alloc-button').addEventListener('click', function () { el('alloc-file-input').click(); });
      el('load-slab-button').addEventListener('click', function () { el('slab-file-input').click(); });
      el('load-addr-button').addEventListener('click', function () { el('addr-file-input').click(); });
      el('alloc-file-input').addEventListener('change', function () { readFile(this, loadAlloc); });
      el('slab-file-input').addEventListener('change', function () { readFile(this, loadSlab); });
      el('addr-file-input').addEventListener('change', function () { readFile(this, loadAddr); });
      el('filter-input').addEventListener('input', render);
      el('view-select').addEventListener('change', render);
      fetch('../../shared/_captures/mm-hook-allocpages.txt').then(function (r) { if (!r.ok) throw new Error(); return r.text(); }).then(loadAlloc).catch(function () { el('status').textContent = 'shared/_captures/mm-hook-allocpages.txt not found'; });
      fetch('../../shared/_captures/mm-hook-slab.txt').then(function (r) { if (!r.ok) throw new Error(); return r.text(); }).then(loadSlab).catch(function () {});
      fetch('../../shared/_captures/mm-hook-address-space.txt').then(function (r) { if (!r.ok) throw new Error(); return r.text(); }).then(loadAddr).catch(function () {});
    })();
  </script>
