<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VFS Study Viewer</title>
  <link rel="stylesheet" href="../theme.css">
  <style>
    html, body { width: 100%; height: 100%; overflow: hidden; font-size: 12px; }

    #vfs-app {
      width: 100vw;
      height: 100vh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 12px;
      padding: 12px;
    }

    #toolbar, #summary, .card, #details {
      border: 1px solid var(--line);
      border-radius: 20px;
      background: rgba(15, 23, 42, 0.78);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    #toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px;
      min-width: 0;
    }

    h1 { font-family: var(--mono); font-size: 13px; white-space: nowrap; }
    h1 span { color: var(--blue); }

    button, input, select {
      height: 30px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--soft);
      color: var(--text);
      font-family: var(--mono);
      font-size: 10px;
    }

    button { padding: 0 10px; cursor: pointer; }
    input { width: min(280px, 28vw); padding: 0 9px; }
    select { padding: 0 8px; }

    #status {
      margin-left: auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 10px;
    }

    #main {
      min-height: 0;
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr) 380px;
      gap: 10px;
    }

    #summary, #content, #details { min-height: 0; overflow: auto; }
    #summary, #details { padding: 12px; }
    #content { display: grid; gap: 10px; align-content: start; }

    .section-title {
      margin-bottom: 8px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
    .stat { border: 1px solid var(--line); border-radius: 13px; background: var(--panel-2); padding: 10px; }
    .stat b { display: block; font-family: var(--mono); font-size: 18px; line-height: 1.15; }
    .stat span { color: var(--muted); font-size: 11px; }

    .bar-row {
      display: grid;
      grid-template-columns: 96px minmax(0, 1fr) 46px;
      align-items: center;
      gap: 8px;
      margin-bottom: 7px;
      font-family: var(--mono);
      font-size: 10px;
    }

    .bar-row span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bar-track { height: 10px; border-radius: 999px; background: #0b1424; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 999px; background: var(--blue); }
    .bar-fill.green { background: var(--green); }
    .bar-fill.orange { background: var(--orange); }
    .bar-fill.purple { background: var(--purple); }

    .card { min-width: 0; padding: 14px; overflow: hidden; }
    .card-header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
    .card h2 { font-size: 13px; }
    .card small { color: var(--muted); font-family: var(--mono); }

    #timeline {
      height: 220px;
      display: grid;
      grid-template-columns: repeat(96, minmax(3px, 1fr));
      align-items: end;
      gap: 2px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: linear-gradient(rgba(148, 163, 184, 0.10) 1px, transparent 1px), rgba(2, 6, 23, 0.72);
      background-size: 100% 44px;
    }

    .time-bin { min-width: 3px; border-radius: 5px 5px 0 0; cursor: pointer; background: var(--blue); }
    .time-bin[data-kind="INODE"] { background: var(--green); }
    .time-bin[data-kind="DENTRY"] { background: var(--purple); }

    .legend { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 10px; color: var(--muted); font-family: var(--mono); font-size: 10px; }
    .legend i { display: inline-block; width: 10px; height: 10px; margin-right: 5px; border-radius: 2px; vertical-align: -1px; }

    .split { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .flow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .flow-card { border: 1px solid var(--line); border-radius: 14px; background: var(--soft); padding: 12px; cursor: pointer; }
    .flow-card b { display: block; font-family: var(--mono); font-size: 18px; }
    .flow-card span { color: var(--muted); }
    .flow-card.super b { color: var(--blue); }
    .flow-card.inode b { color: var(--green); }
    .flow-card.dentry b { color: var(--purple); }

    .table-wrap { overflow: auto; }
    table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 10px; }
    th, td { padding: 7px 6px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
    th { color: var(--muted); font-weight: 600; }
    tr { cursor: pointer; }
    tr:hover { background: var(--soft); }

    .pill { display: inline-block; padding: 2px 6px; border: 1px solid var(--line); border-radius: 999px; background: #0b1424; color: var(--muted); }
    .pill.on { color: var(--green); border-color: rgba(52, 211, 153, 0.45); }
    .pill.warn { color: var(--orange); border-color: rgba(245, 158, 11, 0.45); }

    .detail-card { border: 1px solid var(--line); border-radius: 13px; background: var(--panel-2); padding: 10px; margin-bottom: 10px; font-family: var(--mono); }
    .detail-card h2 { font-size: 12px; margin-bottom: 8px; overflow-wrap: anywhere; }
    .field { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px solid var(--line); padding: 5px 0; font-size: 10px; }
    .field b { color: var(--muted); font-weight: 500; }
    .field span { overflow-wrap: anywhere; text-align: right; }
    .empty { margin: 14px 0; color: var(--muted); font-family: var(--mono); }

    @media (max-width: 1120px) {
      body { overflow: auto; }
      #vfs-app { height: auto; min-height: 100vh; }
      #main { grid-template-columns: 1fr; }
    }

    @media (max-width: 720px) {
      #toolbar { flex-wrap: wrap; }
      #status { flex-basis: 100%; margin-left: 0; }
      input, select, button { flex: 1 1 auto; }
      .split, .flow { grid-template-columns: 1fr; }
      #timeline { grid-template-columns: repeat(48, minmax(3px, 1fr)); }
    }
  </style>
</head>

<body>
  <div id="vfs-app">
    <div id="toolbar">
      <h1><span>VFS</span> Study</h1>
      <button id="load-super-button">Load Super</button>
      <input id="super-file-input" type="file" accept=".txt" hidden>
      <button id="load-inode-button">Load Inode</button>
      <input id="inode-file-input" type="file" accept=".txt" hidden>
      <button id="load-dentry-button">Load Dentry</button>
      <input id="dentry-file-input" type="file" accept=".txt" hidden>
      <input id="filter-input" type="search" placeholder="filter fs, task, name, event">
      <select id="view-select">
        <option value="overview">overview</option>
        <option value="super">superblocks</option>
        <option value="inode">inodes</option>
        <option value="dentry">dentries</option>
      </select>
      <div id="status">No data loaded</div>
    </div>

    <div id="main">
      <aside id="summary">
        <div class="section-title">Summary</div>
        <div class="stat-grid">
          <div class="stat"><b id="super-count">0</b><span>superblocks</span></div>
          <div class="stat"><b id="inode-count">0</b><span>inodes</span></div>
          <div class="stat"><b id="dentry-count">0</b><span>dentries</span></div>
          <div class="stat"><b id="fs-count">0</b><span>filesystems</span></div>
        </div>
        <div class="section-title">Filesystems</div>
        <div id="fs-bars"></div>
        <div class="section-title">Tasks</div>
        <div id="task-bars"></div>
        <div class="section-title">Dentry Names</div>
        <div id="name-bars"></div>
      </aside>
      <main id="content"><div class="empty">Loading VFS captures...</div></main>
      <aside id="details"><div class="section-title">Details</div><div class="empty">Select a bar, bin, row, or lifecycle card.</div></aside>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      var superEvents = [];
      var inodeEvents = [];
      var dentryEvents = [];

      function el(id) { return document.getElementById(id); }
      function escapeHtml(value) {
        return String(value == null ? '' : value).replace(/[&<>\"]/g, function (ch) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;' }[ch];
        });
      }
      function timestamp(line) {
        var left = line.indexOf('[');
        var right = line.indexOf(']');
        return left >= 0 && right > left ? line.slice(left + 1, right).trim() : '-';
      }
      function fields(text) {
        var out = {};
        text.trim().split(/\s+/).forEach(function (part) {
          var eq = part.indexOf('=');
          if (eq > 0) out[part.slice(0, eq)] = part.slice(eq + 1);
        });
        return out;
      }
      function parseCapture(text, prefix) {
        var events = [];
        text.split('\n').forEach(function (line, index) {
          var at = line.indexOf(prefix + ' ');
          if (at < 0) return;
          var kv = fields(line.slice(at + prefix.length + 1));
          var time = timestamp(line);
          events.push({ id: prefix + ':' + events.length, line: index + 1, raw: line, prefix: prefix, time: time, timeNumber: parseFloat(time), event: kv.event || 'unknown', fields: kv });
        });
        return events;
      }
      function numberValue(value) {
        var parsed = parseInt(value || '0', 10);
        return isFinite(parsed) ? parsed : 0;
      }
      function prettyNumber(value) { return Number(value || 0).toLocaleString(); }
      function allEvents() { return superEvents.concat(inodeEvents, dentryEvents); }
      function filtered(events) {
        var q = el('filter-input').value.trim().toLowerCase();
        if (!q) return events;
        return events.filter(function (event) { return event.raw.toLowerCase().indexOf(q) >= 0; });
      }
      function filteredAll() { return filtered(allEvents()); }
      function countBy(events, keyFn) {
        var counts = {};
        events.forEach(function (event) {
          var key = keyFn(event) || 'unknown';
          counts[key] = (counts[key] || 0) + 1;
        });
        return counts;
      }
      function topEntries(counts, limit) {
        return Object.keys(counts).map(function (key) { return { key: key, count: counts[key] }; })
          .sort(function (a, b) { return b.count - a.count; }).slice(0, limit);
      }
      function renderBars(id, entries, colorClass) {
        var max = entries.length ? entries[0].count : 1;
        el(id).innerHTML = entries.map(function (entry) {
          var pct = Math.max(2, (entry.count / max) * 100);
          return '<div class="bar-row"><span title="' + escapeHtml(entry.key) + '">' + escapeHtml(entry.key) + '</span><div class="bar-track"><div class="bar-fill ' + (colorClass || '') + '" style="width:' + pct.toFixed(1) + '%"></div></div><b>' + prettyNumber(entry.count) + '</b></div>';
        }).join('') || '<div class="empty">No data</div>';
      }
      function showDetails(title, rows) {
        var html = rows.map(function (row) { return '<div class="field"><b>' + escapeHtml(row[0]) + '</b><span>' + escapeHtml(row[1]) + '</span></div>'; }).join('');
        el('details').innerHTML = '<div class="section-title">Details</div><div class="detail-card"><h2>' + escapeHtml(title) + '</h2>' + html + '</div>';
      }
      function showEvent(event) {
        var rows = [['prefix', event.prefix], ['event', event.event], ['time', event.time], ['line', event.line], ['raw', event.raw]];
        Object.keys(event.fields).sort().forEach(function (key) { rows.push([key, event.fields[key]]); });
        showDetails(event.prefix + ' ' + event.event, rows);
      }
      function updateSummary() {
        var events = filteredAll();
        var fsNames = countBy(events, function (event) { return event.fields.fs || event.fields.sb_id; });
        el('super-count').textContent = prettyNumber(filtered(superEvents).length);
        el('inode-count').textContent = prettyNumber(filtered(inodeEvents).length);
        el('dentry-count').textContent = prettyNumber(filtered(dentryEvents).length);
        el('fs-count').textContent = prettyNumber(Object.keys(fsNames).length);
        renderBars('fs-bars', topEntries(fsNames, 9), 'green');
        renderBars('task-bars', topEntries(countBy(events, function (event) { return event.fields.task; }), 7), 'purple');
        renderBars('name-bars', topEntries(countBy(filtered(dentryEvents), function (event) { return event.fields.name; }), 8), 'orange');
      }
      function renderTimeline(events) {
        var times = events.map(function (event) { return event.timeNumber; }).filter(function (time) { return isFinite(time); });
        var min = times.length ? Math.min.apply(null, times) : 0;
        var max = times.length ? Math.max.apply(null, times) : min + 1;
        var span = Math.max(0.001, max - min);
        var bins = [];
        for (var i = 0; i < 96; i += 1) bins.push({ events: [], topKind: 'SUPER', start: min + span * i / 96, end: min + span * (i + 1) / 96 });
        events.forEach(function (event) {
          var idx = isFinite(event.timeNumber) ? Math.min(95, Math.floor(((event.timeNumber - min) / span) * 96)) : 0;
          bins[idx].events.push(event);
        });
        bins.forEach(function (bin) {
          var counts = countBy(bin.events, function (event) { return event.prefix; });
          var top = topEntries(counts, 1)[0];
          bin.topKind = top ? top.key : 'SUPER';
        });
        var peak = bins.reduce(function (maxCount, bin) { return Math.max(maxCount, bin.events.length); }, 1);
        var chart = bins.map(function (bin, index) {
          var height = Math.max(2, (bin.events.length / peak) * 100);
          return '<div class="time-bin" data-bin="' + index + '" data-kind="' + escapeHtml(bin.topKind) + '" style="height:' + height.toFixed(1) + '%" title="' + bin.start.toFixed(3) + '-' + bin.end.toFixed(3) + 's ' + bin.events.length + ' events"></div>';
        }).join('');
        return '<section class="card"><div class="card-header"><h2>VFS Allocation Timeline</h2><small>color follows dominant event type per bin</small></div><div id="timeline">' + chart + '</div><div class="legend"><span><i style="background:var(--blue)"></i>SUPER</span><span><i style="background:var(--green)"></i>INODE</span><span><i style="background:var(--purple)"></i>DENTRY</span><span>peak bin ' + prettyNumber(peak) + ' events</span></div></section>';
      }
      function bindTimeline(events) {
        var times = events.map(function (event) { return event.timeNumber; }).filter(function (time) { return isFinite(time); });
        var min = times.length ? Math.min.apply(null, times) : 0;
        var max = times.length ? Math.max.apply(null, times) : min + 1;
        var span = Math.max(0.001, max - min);
        Array.prototype.slice.call(el('content').querySelectorAll('.time-bin')).forEach(function (node) {
          node.addEventListener('click', function () {
            var index = numberValue(node.getAttribute('data-bin'));
            var start = min + span * index / 96;
            var end = min + span * (index + 1) / 96;
            var matches = events.filter(function (event) { return isFinite(event.timeNumber) && event.timeNumber >= start && event.timeNumber <= end; });
            showDetails('time bin ' + start.toFixed(6) + '-' + end.toFixed(6) + 's', [
              ['events', matches.length], ['SUPER', countBy(matches, function (event) { return event.prefix; }).SUPER || 0], ['INODE', countBy(matches, function (event) { return event.prefix; }).INODE || 0], ['DENTRY', countBy(matches, function (event) { return event.prefix; }).DENTRY || 0], ['top fs', (topEntries(countBy(matches, function (event) { return event.fields.fs || event.fields.sb_id; }), 1)[0] || {}).key || '-']
            ]);
          });
        });
      }
      function renderFlow() {
        return '<section class="card"><div class="card-header"><h2>Object Lifecycle View</h2><small>generic VFS allocation objects</small></div><div class="flow"><div class="flow-card super" data-flow="SUPER"><b>' + prettyNumber(filtered(superEvents).length) + '</b><span>superblocks allocate filesystem instances</span></div><div class="flow-card inode" data-flow="INODE"><b>' + prettyNumber(filtered(inodeEvents).length) + '</b><span>inodes carry metadata and operation tables</span></div><div class="flow-card dentry" data-flow="DENTRY"><b>' + prettyNumber(filtered(dentryEvents).length) + '</b><span>dentries cache names and lookup state</span></div></div></section>';
      }
      function bindFlow() {
        Array.prototype.slice.call(el('content').querySelectorAll('.flow-card')).forEach(function (node) {
          node.addEventListener('click', function () {
            var prefix = node.getAttribute('data-flow');
            var source = prefix === 'SUPER' ? superEvents : prefix === 'INODE' ? inodeEvents : dentryEvents;
            var events = filtered(source);
            showDetails(prefix, [['events', events.length], ['filesystems', Object.keys(countBy(events, function (event) { return event.fields.fs || event.fields.sb_id; })).length], ['top fs', (topEntries(countBy(events, function (event) { return event.fields.fs || event.fields.sb_id; }), 1)[0] || {}).key || '-']]);
          });
        });
      }
      function pill(on, text, warn) { return '<span class="pill ' + (on ? (warn ? 'warn' : 'on') : '') + '">' + escapeHtml(text) + '</span>'; }
      function renderSuperTable(events) {
        var rows = events.map(function (event) { var f = event.fields; return '<tr data-id="' + event.id + '"><td>' + escapeHtml(event.time) + '</td><td>' + escapeHtml(f.fs) + '</td><td>' + escapeHtml(f.fs_flags) + '</td><td>' + escapeHtml(f.s_flags) + '</td><td>' + pill(f.has_root === '1', 'root') + '</td><td>' + escapeHtml(f.dev) + '</td><td>' + escapeHtml(f.id) + '</td></tr>'; }).join('');
        return '<section class="card"><div class="card-header"><h2>Superblocks</h2><small>generic superblock defaults before fs-specific fill</small></div><div class="table-wrap"><table><thead><tr><th>time</th><th>fs</th><th>fs_flags</th><th>s_flags</th><th>state</th><th>dev</th><th>id</th></tr></thead><tbody>' + rows + '</tbody></table></div></section>';
      }
      function renderInodeTable(events) {
        var rows = events.slice(0, 500).map(function (event) { var f = event.fields; return '<tr data-id="' + event.id + '"><td>' + escapeHtml(event.time) + '</td><td>' + escapeHtml(f.fs) + '</td><td>' + (f.custom_alloc === '1' ? pill(true, 'custom') : pill(true, 'plain', true)) + '</td><td>' + escapeHtml(f.mode) + '</td><td>' + escapeHtml(f.ino) + '</td><td>' + escapeHtml(f.nlink) + '</td><td>' + escapeHtml(f.size) + '</td><td>' + escapeHtml(f.dev) + '</td></tr>'; }).join('');
        return '<section class="card"><div class="card-header"><h2>Inodes</h2><small>first 500 matching rows</small></div><div class="table-wrap"><table><thead><tr><th>time</th><th>fs</th><th>alloc</th><th>mode</th><th>ino</th><th>links</th><th>size</th><th>dev</th></tr></thead><tbody>' + rows + '</tbody></table></div></section>';
      }
      function renderDentryTable(events) {
        var rows = events.slice(0, 500).map(function (event) { var f = event.fields; return '<tr data-id="' + event.id + '"><td>' + escapeHtml(event.time) + '</td><td>' + escapeHtml(f.fs || f.sb_id) + '</td><td>' + escapeHtml(f.name) + '</td><td>' + escapeHtml(f.name_len) + '</td><td>' + (f.negative === '1' ? pill(true, 'negative', true) : pill(true, 'positive')) + '</td><td>' + (f.inline_name === '1' ? pill(true, 'inline') : pill(true, 'external', true)) + '</td><td>' + escapeHtml(f.flags) + '</td></tr>'; }).join('');
        return '<section class="card"><div class="card-header"><h2>Dentries</h2><small>first 500 matching rows</small></div><div class="table-wrap"><table><thead><tr><th>time</th><th>fs</th><th>name</th><th>len</th><th>state</th><th>name store</th><th>flags</th></tr></thead><tbody>' + rows + '</tbody></table></div></section>';
      }
      function bindRows(events) {
        Array.prototype.slice.call(el('content').querySelectorAll('tr[data-id]')).forEach(function (row) {
          row.addEventListener('click', function () {
            var id = row.getAttribute('data-id');
            var event = events.filter(function (item) { return item.id === id; })[0];
            if (event) showEvent(event);
          });
        });
      }
      function renderOverview() {
        var events = filteredAll();
        updateSummary();
        if (!events.length) { el('content').innerHTML = '<div class="card"><div class="empty">No VFS events match the current filter.</div></div>'; return; }
        el('content').innerHTML = renderTimeline(events) + renderFlow() + '<div class="split">' + renderInodeTable(filtered(inodeEvents)) + renderDentryTable(filtered(dentryEvents)) + '</div>';
        bindTimeline(events);
        bindFlow();
        bindRows(filtered(inodeEvents).concat(filtered(dentryEvents)));
      }
      function render() {
        updateSummary();
        var view = el('view-select').value;
        if (view === 'super') { el('content').innerHTML = renderSuperTable(filtered(superEvents)); bindRows(filtered(superEvents)); return; }
        if (view === 'inode') { el('content').innerHTML = renderInodeTable(filtered(inodeEvents)); bindRows(filtered(inodeEvents)); return; }
        if (view === 'dentry') { el('content').innerHTML = renderDentryTable(filtered(dentryEvents)); bindRows(filtered(dentryEvents)); return; }
        renderOverview();
      }
      function setStatus() {
        el('status').textContent = prettyNumber(superEvents.length) + ' SUPER, ' + prettyNumber(inodeEvents.length) + ' INODE, ' + prettyNumber(dentryEvents.length) + ' DENTRY';
      }
      function loadSuper(text) { superEvents = parseCapture(text, 'SUPER'); setStatus(); render(); }
      function loadInode(text) { inodeEvents = parseCapture(text, 'INODE'); setStatus(); render(); }
      function loadDentry(text) { dentryEvents = parseCapture(text, 'DENTRY'); setStatus(); render(); }
      function readFile(input, callback) {
        var file = input.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function (event) { callback(event.target.result); };
        reader.readAsText(file);
        input.value = '';
      }
      el('load-super-button').addEventListener('click', function () { el('super-file-input').click(); });
      el('load-inode-button').addEventListener('click', function () { el('inode-file-input').click(); });
      el('load-dentry-button').addEventListener('click', function () { el('dentry-file-input').click(); });
      el('super-file-input').addEventListener('change', function () { readFile(this, loadSuper); });
      el('inode-file-input').addEventListener('change', function () { readFile(this, loadInode); });
      el('dentry-file-input').addEventListener('change', function () { readFile(this, loadDentry); });
      el('filter-input').addEventListener('input', render);
      el('view-select').addEventListener('change', render);
      fetch('../../shared/_captures/vfs-hook-super.txt').then(function (r) { if (!r.ok) throw new Error(); return r.text(); }).then(loadSuper).catch(function () { el('status').textContent = 'shared/_captures/vfs-hook-super.txt not found'; });
      fetch('../../shared/_captures/vfs-hook-inode.txt').then(function (r) { if (!r.ok) throw new Error(); return r.text(); }).then(loadInode).catch(function () {});
      fetch('../../shared/_captures/vfs-hook-dentry.txt').then(function (r) { if (!r.ok) throw new Error(); return r.text(); }).then(loadDentry).catch(function () {});
    })();
  </script>
</body>

</html>
